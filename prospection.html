<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0A1428">
<title>Prospection — Marchéo</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #080F1F; --panel: #0F1A33; --panel-2: #15244A; --line: rgba(255,255,255,0.10);
    --txt: #fff; --txt-2: rgba(255,255,255,0.62); --or: #F4B942; --vert-fonce: #0A1428;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--txt); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  #map { position: absolute; inset: 0; z-index: 1; background: #dde3ea; }

  /* ---------- Barre du haut ---------- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    background: linear-gradient(180deg, rgba(8,15,31,0.97), rgba(8,15,31,0.90));
    border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .titre { font-family: 'Manrope', system-ui, sans-serif; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .titre span { color: var(--or); }
  .sous { font-size: 12px; color: var(--txt-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compteur-m { display: none; font-size: 12px; color: var(--txt-2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 13px; white-space: nowrap; min-height: 38px;
  }
  .btn:hover { border-color: rgba(255,255,255,0.25); }
  .btn.or { background: var(--or); color: var(--vert-fonce); border-color: var(--or); font-weight: 600; }
  .btn.on { border-color: var(--or); color: var(--or); }
  .btn.petit { padding: 5px 9px; min-height: 30px; font-size: 12px; }
  .btn .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .btn .badge:empty { display: none; }
  a.btn { color: var(--txt); text-decoration: none; display: inline-flex; align-items: center; }
  a.btn.or { color: var(--vert-fonce); }
  .sync-ok { color: #4ade80; } .sync-attente { color: var(--or); } .sync-erreur { color: #f87171; }
  .search {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 14px; min-height: 38px; outline: none;
  }
  .search:focus { border-color: var(--or); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips-titre { flex: none; font-size: 11px; color: var(--txt-2); text-transform: uppercase; letter-spacing: .06em; align-self: center; padding-right: 2px; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 5px 10px; font-size: 12px; background: var(--panel); border: 1px solid var(--line);
    color: var(--txt-2); white-space: nowrap;
  }
  .chip.on { color: var(--txt); border-color: rgba(255,255,255,0.35); background: var(--panel-2); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip b { font-weight: 600; color: var(--txt); }
  .filtres, #rayonRow { display: none; }
  .filtres.open, #rayonRow.open { display: block; }

  /* ---------- Fiche commerce ---------- */
  .fiche {
    position: absolute; z-index: 1100; right: 12px; top: var(--top-h, 110px); bottom: 12px; width: 390px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45); display: none; flex-direction: column; overflow: hidden;
  }
  .fiche.open { display: flex; }
  .fiche-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); position: relative; }
  .fiche-head .bandeau { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .fiche-nom { font-family: 'Manrope', system-ui, sans-serif; font-size: 19px; font-weight: 700; padding-right: 36px; line-height: 1.25; }
  .fiche-cat { font-size: 13px; color: var(--txt-2); margin-top: 4px; }
  .fermer { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 16px; }
  .fiche-body { padding: 14px 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .infos { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--txt-2); }
  .infos a { color: var(--or); text-decoration: none; overflow-wrap: anywhere; }
  .infos .dirigeant { color: var(--txt); font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--txt-2); margin-bottom: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .statut {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px;
    background: var(--panel-2); border: 1.5px solid transparent; font-size: 13px; text-align: left; min-height: 40px;
  }
  .statut .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .statut.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel-2)); }
  .rapide { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 13px; text-align: left; min-height: 42px; }
  .rapide:active { transform: scale(0.97); }
  .segment { display: flex; gap: 6px; }
  .segment button { flex: 1; padding: 8px 6px; border-radius: 10px; background: var(--panel-2); border: 1.5px solid transparent; font-size: 13px; }
  .segment button.on { border-color: var(--or); background: color-mix(in srgb, var(--or) 18%, var(--panel-2)); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 6px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; color: var(--txt-2); }
  .tag.on { color: #fff; border-color: #f87171; background: color-mix(in srgb, #dc2626 25%, var(--panel-2)); }
  .couleurs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--line); }
  .sw.on { border-color: #fff; }
  .sw.auto { background: conic-gradient(#64748b, #3b82f6, #f59e0b, #8b5cf6, #10b981, #dc2626, #64748b); font-size: 0; }
  textarea, .champ {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none;
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  textarea:focus, .champ:focus { border-color: var(--or); }
  .champ { min-height: 40px; color-scheme: dark; }
  .micro { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--txt); }
  .micro.rec { background: #dc2626; border-color: #dc2626; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .save-state { font-size: 11px; color: var(--txt-2); margin-top: 6px; height: 14px; }
  .histo { font-size: 12px; color: var(--txt-2); display: flex; flex-direction: column; gap: 4px; }
  .histo div { display: flex; gap: 8px; }
  .histo time { flex: none; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; }

  /* ---------- Panneau gauche (liste / aujourd'hui / tournée) ---------- */
  .panneau {
    position: absolute; z-index: 1050; left: 12px; bottom: 12px; width: 370px; max-height: calc(100% - var(--top-h, 110px) - 12px);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45); display: none; flex-direction: column; overflow: hidden;
  }
  .panneau.open { display: flex; }
  .panneau-head { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--txt-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panneau-head strong { color: var(--txt); font-size: 14px; }
  .panneau-body { overflow-y: auto; }
  .section-titre { padding: 12px 12px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--or); font-weight: 700; }
  .vide { padding: 4px 12px 10px; font-size: 13px; color: var(--txt-2); }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
  .item:hover { background: var(--panel-2); }
  .item .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; flex: none; }
  .item .num { width: 22px; height: 22px; border-radius: 50%; background: var(--or); color: var(--vert-fonce); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .item-txt { min-width: 0; flex: 1; }
  .item-nom { font-size: 14px; font-weight: 600; }
  .item-sous { font-size: 12px; color: var(--txt-2); margin-top: 2px; }
  .item-memo { font-size: 12px; color: var(--or); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-btns { display: flex; gap: 4px; flex: none; }
  .item-btns button { width: 28px; height: 28px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px 12px 10px; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-family: 'Manrope', system-ui, sans-serif; }
  .stat span { font-size: 11px; color: var(--txt-2); }
  .barre { display: flex; align-items: center; gap: 8px; padding: 3px 12px; font-size: 12px; }
  .barre i { display: block; height: 6px; border-radius: 3px; background: #f87171; }
  .barre span:first-child { width: 150px; flex: none; color: var(--txt-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Divers ---------- */
  .toast {
    position: absolute; z-index: 1300; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; display: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { display: block; }
  .chargement {
    position: absolute; inset: 0; z-index: 1200; display: flex; align-items: center; justify-content: center;
    background: rgba(8,15,31,0.65); font-size: 14px; flex-direction: column; gap: 12px; text-align: center; padding: 20px;
  }
  .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--or); border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .mode-ajout #map { cursor: crosshair; }
  .leaflet-tooltip.tt { background: var(--panel); color: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; padding: 4px 8px; box-shadow: none; }
  .leaflet-tooltip.tt::before { display: none; }
  .num-etape { background: var(--or); color: var(--vert-fonce); border: 2px solid #fff; border-radius: 50%; font: 700 11px/18px system-ui, sans-serif; text-align: center; width: 22px !important; height: 22px !important; }
  .leaflet-top.leaflet-left { top: var(--top-h, 110px); }
  .leaflet-control-attribution { font-size: 10px; }

  @media (max-width: 720px) {
    .titre-bloc { display: none; }
    .compteur-m { display: block; }
    .topbar .row:first-child { justify-content: space-between; }
    .topbar .row:first-child .spacer { display: none; }
    .hide-m { display: none; }
    .fiche { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 80vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    .panneau { left: 0; right: 0; bottom: 0; width: auto; border-radius: 18px 18px 0 0; max-height: 62vh; padding-bottom: env(safe-area-inset-bottom); }
    .leaflet-top.leaflet-left { display: none; }
  }
</style>
</head>
<body>

<div id="map"></div>

<header class="topbar" id="topbar">
  <div class="row">
    <div class="titre-bloc" style="min-width:0">
      <div class="titre">Prospection <span>Deauville → Caen</span></div>
      <div class="sous" id="sousTitre">Commerces de bouche · chargement…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnLoc" title="Autour de moi">📍<span class="hide-m"> Autour de moi</span></button>
    <button class="btn" id="btnJour" title="Aujourd'hui">☀️<span class="hide-m"> Aujourd’hui</span><span class="badge" id="badgeJour"></span></button>
    <button class="btn" id="btnTournee" title="Tournée">🧭<span class="hide-m"> Tournée</span><span class="badge" id="badgeTournee" style="background:var(--or);color:var(--vert-fonce)"></span></button>
    <button class="btn" id="btnListe" title="Liste">☰<span class="hide-m"> Liste</span></button>
    <button class="btn" id="btnFiltres" title="Filtres">⚙︎<span class="hide-m"> Filtres</span></button>
    <button class="btn" id="btnSync" title="Synchronisation">☁︎</button>
  </div>
  <div class="row" style="margin-top:8px">
    <input class="search" id="recherche" type="search" placeholder="Rechercher un nom, une ville, un gérant, un mémo…" autocomplete="off">
  </div>
  <div class="compteur-m" id="compteurM"></div>
  <div id="rayonRow">
    <div class="chips" id="chipsRayon"></div>
  </div>
  <div class="chips" id="chipsStatuts"></div>
  <div class="filtres" id="panneauFiltres">
    <div class="chips" id="chipsCats"></div>
    <div class="chips"><span class="chips-titre">Potentiel</span><span id="chipsPotentiel" style="display:contents"></span></div>
    <div class="chips"><span class="chips-titre">Sources</span><span id="chipsSources" style="display:contents"></span></div>
    <div class="chips">
      <button class="chip" id="chipChaines">Masquer les chaînes</button>
      <button class="chip" id="chipMemo">Avec mémo seulement</button>
      <button class="chip" id="chipRappel">Rappels échus</button>
    </div>
    <div class="chips">
      <button class="chip" id="btnAjout">＋ Ajouter un commerce</button>
      <button class="chip" id="btnMaj">↻ Actualiser les données</button>
      <button class="chip" id="btnExportCsv">⬇ Export CSV</button>
      <button class="chip" id="btnExportJson">⬇ Sauvegarde</button>
      <button class="chip" id="btnImport">⬆ Restaurer</button>
      <input type="file" id="fichierImport" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<aside class="panneau" id="panneau">
  <div class="panneau-head" id="panneauHead"></div>
  <div class="panneau-body" id="panneauBody"></div>
</aside>

<aside class="fiche" id="fiche">
  <div class="fiche-head">
    <div class="bandeau" id="ficheBandeau"></div>
    <div class="fiche-nom" id="ficheNom"></div>
    <div class="fiche-cat" id="ficheCat"></div>
    <button class="fermer" id="fermerFiche" aria-label="Fermer">✕</button>
  </div>
  <div class="fiche-body">
    <div class="infos" id="ficheInfos"></div>
    <div class="actions" id="ficheActions"></div>
    <div>
      <div class="lbl">Sur place</div>
      <div class="grille2" id="ficheRapides"></div>
    </div>
    <div>
      <div class="lbl">Statut</div>
      <div class="grille2" id="ficheStatuts"></div>
    </div>
    <div>
      <div class="lbl">Potentiel</div>
      <div class="segment" id="fichePotentiel"></div>
    </div>
    <div>
      <div class="lbl">Mémo <button class="micro" id="btnMicro" type="button" hidden>🎤 Dicter</button></div>
      <textarea id="ficheMemo" placeholder="Nom du gérant, horaires de passage, intérêt, ce qu’il vend…"></textarea>
      <div class="save-state" id="saveState"></div>
    </div>
    <div>
      <div class="lbl">Objections</div>
      <div class="tags" id="ficheObjections"></div>
    </div>
    <div>
      <div class="lbl">Contact (gérant)</div>
      <input class="champ" id="ficheContact" placeholder="Nom, tél. direct, e-mail…">
    </div>
    <div class="row">
      <div style="flex:1.3">
        <div class="lbl">Rappel / RDV le</div>
        <input class="champ" id="ficheRappel" type="date">
      </div>
      <div style="flex:1">
        <div class="lbl">à</div>
        <input class="champ" id="ficheHeure" type="time">
      </div>
    </div>
    <div>
      <div class="lbl">Couleur du repère</div>
      <div class="couleurs" id="ficheCouleurs"></div>
    </div>
    <div>
      <div class="lbl">Historique</div>
      <div class="histo" id="ficheHisto"></div>
    </div>
    <button class="btn" id="btnSupprimer" style="display:none;align-self:flex-start">Supprimer ce commerce ajouté</button>
  </div>
</aside>

<div class="chargement" id="chargement"><div class="spin"></div><div id="chargementTxt">Chargement des commerces…</div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================================================================
// Configuration
// ============================================================================
// Zone couverte : de Caen (ouest/sud) à Deauville-Trouville / Pont-l'Évêque (est), côte comprise.
const BBOX = { sud: 49.08, ouest: -0.50, nord: 49.43, est: 0.22 };

const SUPABASE_URL = 'https://epvdzhzwfmtnioedyfgm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwdmR6aHp3Zm10bmlvZWR5ZmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDYwMTgsImV4cCI6MjA5MjAyMjAxOH0.NnMHas3OCJxfqQW3lUG9LDrklsuO_c9-Xpm41K5q1uc';

const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];

// Registre national des entreprises (SIRENE / RNE) — API publique, CORS ouvert.
const SIRENE_URL = 'https://recherche-entreprises.api.gouv.fr/near_point';
// Deux requêtes pour rester sous la limite de 100 pages × 25 résultats de l'API.
const SIRENE_GROUPES = [
  '10.13B,10.51C,10.71B,10.71C,10.71D,10.82Z,11.01Z,11.03Z,56.21Z',
  '47.21Z,47.22Z,47.23Z,47.24Z,47.25Z,47.29Z'
];
const NAF_CAT = {
  '10.13B': 'charcuterie', '10.51C': 'fromagerie', '10.71B': 'boulangerie', '10.71C': 'boulangerie',
  '10.71D': 'patisserie', '10.82Z': 'chocolatier', '11.01Z': 'caviste', '11.03Z': 'caviste',
  '56.21Z': 'charcuterie', '47.21Z': 'primeur', '47.22Z': 'boucherie', '47.23Z': 'poissonnerie',
  '47.24Z': 'patisserie', '47.25Z': 'caviste', '47.29Z': 'epicerie'
};
// Codes NAF "fourre-tout" : on affine la catégorie avec le nom de l'enseigne.
const NAF_GENERIQUES = ['47.24Z', '47.29Z', '56.21Z'];
const NOM_CAT = [
  [/FROMAG|CREMERIE/, 'fromagerie'], [/BOULANG|FOURNIL|\bPAIN/, 'boulangerie'], [/CHOCOLA|CONFIS|CARAMEL|BISCUIT/, 'chocolatier'],
  [/BOUCHER/, 'boucherie'], [/CHARCUT|TRAITEUR/, 'charcuterie'], [/POISSON|MAREE|ECAILL|HUITRE/, 'poissonnerie'],
  [/\bCAVE|\bVINS?\b|CIDRE|CALVADOS/, 'caviste'], [/\bCAFES?\b|TORREFA|\bTHES?\b|\bTEA\b/, 'cafe_the'], [/PRIMEUR|FRUITS/, 'primeur']
];
const SIRENE_EXCLUS = /\bCBD\b|VAPE|TABAC|CIGARETTE|GROSSISTE/;

const CATEGORIES = {
  boulangerie:  { label: 'Boulangerie',        emoji: '🥖' },
  patisserie:   { label: 'Pâtisserie',         emoji: '🍰' },
  boucherie:    { label: 'Boucherie',          emoji: '🥩' },
  charcuterie:  { label: 'Charcuterie / Traiteur', emoji: '🥓' },
  fromagerie:   { label: 'Fromagerie / Crèmerie', emoji: '🧀' },

function lire(k, defaut) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : defaut; } catch { return defaut; } }
function ecrire(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch { toast('⚠️ Stockage local plein ou bloqué — exporte une sauvegarde.'); return false; }
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const aujourdhui = () => dateLocale(new Date());
function dateLocale(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function demain() { const d = new Date(); d.setDate(d.getDate() + 1); return dateLocale(d); }
const fmtDate = iso => new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
function depuis(iso) {
  const j = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return j <= 0 ? 'aujourd’hui' : j === 1 ? 'hier' : `il y a ${j} j`;
}
function titreCase(s) {
  return String(s || '').toLowerCase().replace(/(^|[\s'’\-(])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
}

function requeteOverpass() {
  const b = `${BBOX.sud},${BBOX.ouest},${BBOX.nord},${BBOX.est}`;
  return `[out:json][timeout:90];
(
  nwr["shop"~"^(bakery|pastry|butcher|deli|delicatessen|cheese|dairy|seafood|fish|greengrocer|farm|wine|alcohol|beverages|cider|chocolate|confectionery|coffee|tea|spices|caterer|health_food|organic|honey|food)$"](${b});
  nwr["craft"~"^(caterer|confectionery|bakery|cider|cider_maker|brewery|distillery|winery|cheese_maker)$"](${b});
  nwr["amenity"="marketplace"](${b});
);
out center tags;`;
}

function categorieOsm(t) {
  const s = t.shop, c = t.craft;
  if (t.amenity === 'marketplace') return 'marche';
  if (s === 'bakery' || c === 'bakery') return 'boulangerie';
  if (s === 'pastry') return 'patisserie';
  if (s === 'butcher') return 'boucherie';
  if (s === 'deli' || s === 'caterer' || c === 'caterer') return 'charcuterie';
  if (s === 'cheese' || s === 'dairy' || c === 'cheese_maker') return 'fromagerie';
  if (s === 'seafood' || s === 'fish') return 'poissonnerie';
  if (s === 'greengrocer') return 'primeur';
  if (s === 'farm') return 'ferme';
  if (['wine', 'alcohol', 'beverages', 'cider'].includes(s) || ['cider', 'cider_maker', 'brewery', 'distillery', 'winery'].includes(c)) return 'caviste';
  if (s === 'chocolate' || s === 'confectionery' || c === 'confectionery') return 'chocolatier';
  if (s === 'coffee' || s === 'tea') return 'cafe_the';
  if (['delicatessen', 'spices', 'health_food', 'organic', 'honey', 'food'].includes(s)) return 'epicerie';
  return 'autre';
}

function normaliserOsm(el) {
  const t = el.tags || {};
  const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
  if (lat == null || lon == null) return null;
  const cat = categorieOsm(t);
  const adresse = [[t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' '), [t['addr:postcode'], t['addr:city']].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  return {
    id: `${el.type}/${el.id}`, source: 'osm',
    nom: t.name || t.brand || '', cat, lat, lon,
    ville: t['addr:city'] || '', adresse,
    tel: t.phone || t['contact:phone'] || '',
    web: t.website || t['contact:website'] || '',
    email: t.email || t['contact:email'] || '',
    horaires: t.opening_hours || '',
    chaine: !!(t.brand || t['brand:wikidata']), marque: t.brand || ''
  };
}

async function chargerOsm(force) {
  const cache = lire(K.osm, null);
  if (cache && !force) return cache;
  const corps = 'data=' + encodeURIComponent(requeteOverpass());
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: 'POST', body: corps, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const json = await r.json();
      const vus = new Set();
      const liste = json.elements.map(normaliserOsm).filter(c => c && !vus.has(c.id) && vus.add(c.id));
      const data = { date: new Date().toISOString(), liste };
      ecrire(K.osm, data);
      return data;
    } catch { /* serveur suivant */ }
  }
  if (cache) return cache;
  throw new Error('osm');
}

// ============================================================================
// Données : registre des entreprises (SIRENE / RNE)
// ============================================================================
const attendre = ms => new Promise(r => setTimeout(r, ms));

async function pageSirene(groupe, page) {
  const url = `${SIRENE_URL}?lat=${CENTRE.lat}&long=${CENTRE.lon}&radius=33&activite_principale=${groupe}` +
    `&per_page=25&page=${page}&minimal=true&include=matching_etablissements,dirigeants&limite_matching_etablissements=100`;
  for (let essai = 0; essai < 5; essai++) {
    const r = await fetch(url);
    if (r.status === 429) { await attendre(1500 * (essai + 1)); continue; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  throw new Error('429');
}

function dirigeantDe(ul) {
  const pp = (ul.dirigeants || []).filter(d => d.type_dirigeant === 'personne physique' && !/commissaire/i.test(d.qualite || ''));
  return pp.slice(0, 2).map(d => {
    const prenom = titreCase((d.prenoms || '').split(/\s+/)[0]);
    return `${prenom} ${titreCase(d.nom || '')}`.trim() + (d.qualite ? ` (${d.qualite.toLowerCase()})` : '');
  }).join(', ');
}

function normaliserSirene(ul) {
  const sortie = [];
  for (const e of ul.matching_etablissements || []) {
    if (e.etat_administratif !== 'A' || !NAF_CAT[e.activite_principale]) continue;
    const lat = parseFloat(e.latitude), lon = parseFloat(e.longitude);
    if (!isFinite(lat) || !isFinite(lon) || lat < BBOX.sud || lat > BBOX.nord || lon < BBOX.ouest || lon > BBOX.est) continue;
    const enseigne = (e.liste_enseignes || [])[0] || e.nom_commercial || '';
    const brut = (enseigne || (ul.nom_complet || '').replace(/\s*\(.*\)\s*$/, '')).trim();
    if (SIRENE_EXCLUS.test(brut.toUpperCase())) continue;
    let cat = NAF_CAT[e.activite_principale];
    if (NAF_GENERIQUES.includes(e.activite_principale)) {
      const trouve = NOM_CAT.find(([re]) => re.test(brut.toUpperCase()));
      if (trouve) cat = trouve[1];
    }
    sortie.push({
      id: 'siret/' + e.siret, source: enseigne ? 'registre' : 'registre_brut',
      nom: titreCase(brut), cat, lat, lon,
      ville: titreCase(e.libelle_commune || ''), adresse: titreCase(e.adresse || ''),
      tel: '', web: '', email: '', horaires: '',
      chaine: (ul.nombre_etablissements || 0) > 5, marque: (ul.nombre_etablissements || 0) > 5 ? titreCase(ul.nom_complet) : '',
      siret: e.siret, raison: titreCase(ul.nom_complet || ''), dirigeant: dirigeantDe(ul),
      creation: e.date_creation || ul.date_creation || '', naf: e.activite_principale
    });
  }
  return sortie;
}

async function chargerSirene(force) {
  const cache = lire(K.sirene, null);
  if (cache && !force) return cache;
  const vus = new Map();
  let complet = true;
  try {
    for (const [gi, groupe] of SIRENE_GROUPES.entries()) {
      const premiere = await pageSirene(groupe, 1);
      const total = Math.min(premiere.total_pages || 1, 100);
      const pages = [premiere];
      let faites = 1;
      const etape = `Registre des entreprises (${gi + 1}/${SIRENE_GROUPES.length})`;
      afficherChargement(`${etape} : page 1/${total}…`);
      // 3 requêtes en parallèle ≈ 6 req/s, sous la limite de 7 req/s de l'API.
      const reste = Array.from({ length: total - 1 }, (_, i) => i + 2);
      while (reste.length) {
        const lot = reste.splice(0, 3);
        const res = await Promise.all(lot.map(p => pageSirene(groupe, p)));
        pages.push(...res); faites += lot.length;
        afficherChargement(`${etape} : page ${faites}/${total}…`);
        await attendre(450);
      }
      pages.flatMap(p => p.results || []).flatMap(normaliserSirene).forEach(c => vus.set(c.id, c));
    }
  } catch (e) {
    if (cache) return cache;
    if (!vus.size) throw e;
    complet = false;
  }
  const data = { date: new Date().toISOString(), liste: [...vus.values()] };
  if (complet) ecrire(K.sirene, data);
  return data;
}

// ============================================================================
// Fusion OSM + registre (même commerce = proche + même métier ou nom commun)
// ============================================================================
const MOTS_VIDES = new Set(['boulangerie', 'patisserie', 'boucherie', 'charcuterie', 'fromagerie', 'poissonnerie', 'traiteur', 'primeur',
  'epicerie', 'maison', 'chez', 'cave', 'caves', 'sarl', 'eurl', 'sasu', 'les', 'des', 'aux', 'and', 'normandie', 'chocolaterie', 'boulangerie-patisserie']);
function mots(s) {
  return new Set(String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !MOTS_VIDES.has(w)));
}
function distance(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function fusionner(osm, registre) {
  const liste = osm.map(c => ({ ...c }));
  const motsOsm = liste.map(c => mots(c.nom + ' ' + c.marque));
  const pris = new Set();
  const seuls = [];
  for (const r of registre) {
    const mr = new Set([...mots(r.nom), ...mots(r.raison)]);
    let meilleur = -1, score = 0;
    liste.forEach((o, i) => {
      if (pris.has(i) || Math.abs(o.lat - r.lat) > 0.0015 || Math.abs(o.lon - r.lon) > 0.0025) return;
      const d = distance(o, r);
      if (d > 150) return;
      const nomCommun = [...mr].some(w => motsOsm[i].has(w));
      const s = (nomCommun ? 3 : 0) + (o.cat === r.cat ? 1 : 0) + (d < 40 ? 1 : 0);
      if ((nomCommun || (o.cat === r.cat && d < 60)) && s > score) { score = s; meilleur = i; }
    });
    if (meilleur >= 0) {
      const o = liste[meilleur];
      pris.add(meilleur);
      Object.assign(o, { siret: r.siret, raison: r.raison, dirigeant: r.dirigeant, creation: r.creation, naf: r.naf });
      if (!o.nom) o.nom = r.nom;
      if (!o.adresse) o.adresse = r.adresse;
      if (!o.ville) o.ville = r.ville;
    } else seuls.push(r);
  }
  liste.forEach(c => { if (!c.nom) c.nom = `${CATEGORIES[c.cat].label} (sans nom)`; });
  return [...liste, ...seuls];
}

// Suivi
// ============================================================================
function etat(id) { return suivi[id] || {}; }
function statutDe(id) { return etat(id).statut || 'a_faire'; }
function couleurDe(id) { return etat(id).couleur || STATUTS[statutDe(id)].couleur; }
function potentielDe(id) { return etat(id).potentiel || 'aucun'; }
function rappelEchu(id) { const e = etat(id); return !!e.rappel && e.rappel <= aujourdhui() && !STATUTS_CLOS.includes(statutDe(id)); }

function majSuivi(id, patch, note) {
  const e = Object.assign({}, etat(id), patch, { maj: new Date().toISOString() });
  Object.keys(e).forEach(k => e[k] === undefined && delete e[k]);
  if (note) e.histo = [{ d: e.maj, t: note }, ...(e.histo || [])].slice(0, 60);
  suivi[id] = e;
  ecrire(K.suivi, suivi);
  marquerAEnvoyer(id);
  rafraichirMarqueur(id);
  majCompteurs();
  rafraichirPanneau();
}

function visible(c) {
  if (!filtres.cats.includes(c.cat)) return false;
  if (!filtres.statuts.includes(statutDe(c.id))) return false;
  if (!filtres.potentiels.includes(potentielDe(c.id))) return false;
  if (!filtres.sources.includes(c.source || 'osm')) return false;
  if (filtres.masquerChaines && c.chaine) return false;
  if (filtres.memoSeul && !(etat(c.id).memo || '').trim()) return false;
  if (filtres.rappelEchu && !rappelEchu(c.id)) return false;
  if (filtres.rayon && maPos && distance(maPos, c) > filtres.rayon) return false;
  if (recherche) {
    const e = etat(c.id);
    const h = `${c.nom} ${c.ville} ${c.adresse} ${c.marque} ${c.raison || ''} ${c.dirigeant || ''} ${CATEGORIES[c.cat].label} ${e.memo || ''} ${e.contact || ''}`
      .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    if (!recherche.split(/\s+/).every(m => h.includes(m))) return false;
  }
  return true;
}

function creerMarqueur(c) {
  const m = L.circleMarker([c.lat, c.lon], { renderer: canvas, radius: 8, weight: 2, color: '#fff', fillOpacity: 0.95 });
  m.bindTooltip(() => `${CATEGORIES[c.cat].emoji} ${esc(c.nom)}`, { className: 'tt', direction: 'top', offset: [0, -6] });
  m.on('click', () => ouvrirFiche(c.id));
  marqueurs.set(c.id, m);
  return m;
}

function rafraichirMarqueur(id) {
  const c = parId.get(id), m = marqueurs.get(id);
  if (!c || !m) return;
  const sel = selection === id, echu = rappelEchu(id);
  m.setStyle({
    fillColor: couleurDe(id),
    color: sel ? '#F4B942' : (echu ? '#f59e0b' : '#ffffff'),
    weight: sel ? 4 : (echu ? 3 : 2),
    radius: (sel ? 3 : 0) + POTENTIELS[potentielDe(id)].rayon
  });
  if (visible(c)) { if (!map.hasLayer(m)) m.addTo(map); if (sel) m.bringToFront(); }
  else if (map.hasLayer(m)) m.remove();
}

function appliquerFiltres() {
  commerces.forEach(c => rafraichirMarqueur(c.id));
  majCompteurs();
  rafraichirPanneau();
  ecrire(K.filtres, filtres);
}

  document.getElementById('chipsCats').innerHTML = Object.entries(CATEGORIES).map(([k, c]) =>
    `<button class="chip ${filtres.cats.includes(k) ? 'on' : ''}" data-cat="${k}">${c.emoji} ${c.label} <b data-c="${k}">0</b></button>`).join('');
  document.getElementById('chipsPotentiel').innerHTML = Object.entries(POTENTIELS).map(([k, p]) =>
    `<button class="chip ${filtres.potentiels.includes(k) ? 'on' : ''}" data-pot="${k}">${p.label}</button>`).join('');
  document.getElementById('chipsSources').innerHTML = Object.entries(SOURCES).map(([k, l]) =>
    `<button class="chip ${filtres.sources.includes(k) ? 'on' : ''}" data-src="${k}">${l} <b data-s="${k}">0</b></button>`).join('');
  document.getElementById('chipChaines').classList.toggle('on', filtres.masquerChaines);
  document.getElementById('chipMemo').classList.toggle('on', filtres.memoSeul);
  document.getElementById('chipRappel').classList.toggle('on', filtres.rappelEchu);
  document.getElementById('chipsRayon').innerHTML = [[0, 'Partout'], [500, '500 m'], [1000, '1 km'], [2000, '2 km'], [5000, '5 km']].map(([v, l]) =>
    `<button class="chip ${filtres.rayon === v ? 'on' : ''}" data-rayon="${v}">${v ? '◎ ' : ''}${l}</button>`).join('') +
    `<button class="chip" id="btnProches">🧭 Tournée des 10 plus proches à démarcher</button>`;
}

function basculer(liste, k, tous) {
  // Premier clic quand tout est coché : n'afficher que celui-ci. Sinon bascule normale.
  if (liste.length === tous.length) return [k];
  const r = liste.includes(k) ? liste.filter(x => x !== k) : [...liste, k];
  return r.length ? r : [...tous];
}

document.getElementById('topbar').addEventListener('click', e => {
  const b = e.target.closest('[data-statut],[data-cat],[data-pot],[data-src],[data-rayon]');
  if (!b) return;
  if (b.dataset.statut) filtres.statuts = basculer(filtres.statuts, b.dataset.statut, Object.keys(STATUTS));
  else if (b.dataset.cat) filtres.cats = basculer(filtres.cats, b.dataset.cat, Object.keys(CATEGORIES));
  else if (b.dataset.pot) filtres.potentiels = basculer(filtres.potentiels, b.dataset.pot, Object.keys(POTENTIELS));
  else if (b.dataset.src) {
    filtres.sources = filtres.sources.includes(b.dataset.src) ? filtres.sources.filter(x => x !== b.dataset.src) : [...filtres.sources, b.dataset.src];
    if (!filtres.sources.length) filtres.sources = Object.keys(SOURCES);
  } else if (b.dataset.rayon !== undefined) { filtres.rayon = +b.dataset.rayon; dessinerRayon(); }
  rendreChips(); appliquerFiltres();
});

function majCompteurs() {
  const nS = {}, nC = {}, nSrc = {};
  let vis = 0;
  commerces.forEach(c => {
    const s = statutDe(c.id);
    nS[s] = (nS[s] || 0) + 1;
    nC[c.cat] = (nC[c.cat] || 0) + 1;
    nSrc[c.source || 'osm'] = (nSrc[c.source || 'osm'] || 0) + 1;
    if (visible(c)) vis++;
  });
  document.querySelectorAll('[data-n]').forEach(b => b.textContent = nS[b.dataset.n] || 0);
  document.querySelectorAll('[data-c]').forEach(b => b.textContent = nC[b.dataset.c] || 0);
  document.querySelectorAll('[data-s]').forEach(b => b.textContent = nSrc[b.dataset.s] || 0);
  const faits = commerces.length - (nS.a_faire || 0);
  const txt = `${vis} affichés / ${commerces.length} commerces · ${faits} démarchés · ${nS.signe || 0} inscrits`;
  document.getElementById('sousTitre').textContent = txt;
  document.getElementById('compteurM').textContent = txt;
  const nJour = commerces.filter(c => rappelEchu(c.id)).length;
  document.getElementById('badgeJour').textContent = nJour || '';
  document.getElementById('badgeTournee').textContent = tournee.length || '';
}

document.getElementById('fiche').addEventListener('click', ev => {
  if (!selection) return;
  const id = selection, st = statutDe(id), t = ev.target;
  const b = t.closest('[data-action],[data-s2],[data-pot2],[data-obj],[data-col],#btnFicheTournee');
  if (!b) return;
  if (b.id === 'btnFicheTournee') { basculerTournee(id); return rendreFiche(true); }
  if (b.dataset.action) {
    const a = ACTIONS_RAPIDES.find(x => x.k === b.dataset.action);
    if (a.k === 'repasser') {
      const quand = prompt('Repasser quand ? (ex. « mardi 15h », « après le marché »)');
      if (!quand) return;
      majSuivi(id, { statut: STATUTS_CLOS.includes(st) ? st : 'rappeler', visite: new Date().toISOString() }, `Repasser : ${quand}`);
      rendreFiche(true);
      document.getElementById('ficheRappel').focus();
      return;
    }
    const patch = { statut: a.statut(st), visite: new Date().toISOString() };
    if (a.rappelDemain && !(etat(id).rappel > aujourdhui())) patch.rappel = demain();
    majSuivi(id, patch, a.note + (patch.statut !== st ? ` → ${STATUTS[patch.statut].label}` : ''));
    toast(`✓ ${a.note}`);
  } else if (b.dataset.s2) {
    const k = b.dataset.s2; if (k === st) return;
    const patch = { statut: k };
    if (k !== 'a_faire' && !etat(id).visite) patch.visite = new Date().toISOString();
    majSuivi(id, patch, `Statut → ${STATUTS[k].label}`);
  } else if (b.dataset.pot2) {
    const k = b.dataset.pot2 === potentielDe(id) ? undefined : b.dataset.pot2;
    majSuivi(id, { potentiel: k }, k ? `Potentiel : ${POTENTIELS[k].label}` : 'Potentiel retiré');
  } else if (b.dataset.obj) {
    const o = b.dataset.obj, liste = etat(id).objections || [];
    const ajout = !liste.includes(o);
    majSuivi(id, { objections: ajout ? [...liste, o] : liste.filter(x => x !== o) }, ajout ? `Objection : ${o}` : null);
  } else if (b.dataset.col !== undefined) {
    majSuivi(id, { couleur: b.dataset.col || undefined });
  }
  rendreFiche(true);
});

function ligne(c, opts = {}) {
  const e = etat(c.id);
  const ref = maPos || (opts.centre && { lat: opts.centre.lat, lon: opts.centre.lng });
  const sous = [
    c.ville || c.adresse,
    ref && fmtDist(distance(ref, c)),
    STATUTS[statutDe(c.id)].label,
    e.rappel && `⏰ ${fmtDate(e.rappel + 'T12:00')}${e.heure ? ' ' + e.heure : ''}`,
    e.visite && `vu ${depuis(e.visite)}`,
    potentielDe(c.id) === 'chaud' && '🔥'
  ].filter(Boolean).join(' · ');
  return `<div class="item" data-id="${esc(c.id)}">
    ${opts.num ? `<span class="num">${opts.num}</span>` : `<span class="dot" style="background:${couleurDe(c.id)}"></span>`}
    <div class="item-txt">
      <div class="item-nom">${CATEGORIES[c.cat].emoji} ${esc(c.nom)}</div>
      <div class="item-sous">${esc(sous)}</div>
      ${e.memo ? `<div class="item-memo">${esc(e.memo)}</div>` : ''}
    </div>
    ${opts.btns ? `<div class="item-btns">
      <button data-monter="${esc(c.id)}" title="Monter">↑</button>
      <button data-descendre="${esc(c.id)}" title="Descendre">↓</button>
      <button data-retirer="${esc(c.id)}" title="Retirer">✕</button></div>` : ''}
  </div>`;
}

function rafraichirPanneau() {
  if (!panneauMode) return;
  const head = document.getElementById('panneauHead'), body = document.getElementById('panneauBody');
  const fermer = `<div class="spacer"></div><button class="btn petit" data-fermer-panneau>✕</button>`;

  if (panneauMode === 'liste') {
    const centre = map.getCenter(), ref = maPos || { lat: centre.lat, lon: centre.lng };
    const vis = commerces.filter(visible).map(c => ({ c, d: distance(ref, c) }))
      .sort((a, b) => (rappelEchu(b.c.id) - rappelEchu(a.c.id)) || a.d - b.d);
    head.innerHTML = `<strong>${vis.length} commerces</strong><span>triés par distance ${maPos ? 'à toi' : 'au centre de la carte'}</span>${fermer}`;
    body.innerHTML = vis.slice(0, 300).map(({ c }) => ligne(c, { centre })).join('') +
      (vis.length > 300 ? `<div class="vide">… ${vis.length - 300} autres : zoome, filtre ou cherche pour affiner.</div>` : '') ||
      '<div class="vide">Aucun commerce avec ces filtres.</div>';
  }

  if (panneauMode === 'jour') {
    const auj = aujourdhui();
    const ouverts = commerces.filter(c => !STATUTS_CLOS.includes(statutDe(c.id)));
    const parRappel = (a, b) => ((etat(a.id).rappel || '') + (etat(a.id).heure || '')).localeCompare((etat(b.id).rappel || '') + (etat(b.id).heure || ''));
    const rdvJour = ouverts.filter(c => statutDe(c.id) === 'rdv' && etat(c.id).rappel === auj).sort(parRappel);
    const rappels = ouverts.filter(c => rappelEchu(c.id) && !rdvJour.includes(c)).sort(parRappel);
    const aVenir = ouverts.filter(c => etat(c.id).rappel > auj).sort(parRappel).slice(0, 15);
    const chauds = ouverts.filter(c => potentielDe(c.id) === 'chaud' && !rappels.includes(c) && !rdvJour.includes(c));

    const semaine = Date.now() - 7 * 86400000;
    const histoSemaine = commerces.flatMap(c => (etat(c.id).histo || []).filter(h => new Date(h.d) > semaine).map(h => ({ c, h })));
    const vusSemaine = new Set(histoSemaine.map(x => x.c.id)).size;
    const inscritsSemaine = new Set(histoSemaine.filter(x => x.h.t.includes(STATUTS.signe.label)).map(x => x.c.id)).size;
    const rdvSemaine = new Set(histoSemaine.filter(x => x.h.t.includes(STATUTS.rdv.label)).map(x => x.c.id)).size;
    const nObj = {};
    commerces.forEach(c => (etat(c.id).objections || []).forEach(o => nObj[o] = (nObj[o] || 0) + 1));
    const topObj = Object.entries(nObj).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const maxObj = topObj[0]?.[1] || 1;

    const section = (titre, liste, vide) => `<div class="section-titre">${titre} (${liste.length})</div>` +
      (liste.length ? liste.map(c => ligne(c)).join('') : `<div class="vide">${vide}</div>`);
    head.innerHTML = `<strong>Aujourd’hui</strong><span>${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</span>${fermer}`;
    body.innerHTML =
      `<div class="section-titre">7 derniers jours</div>
       <div class="stats"><div class="stat"><b>${vusSemaine}</b><span>commerces travaillés</span></div>
       <div class="stat"><b>${rdvSemaine}</b><span>RDV pris</span></div>
       <div class="stat"><b>${inscritsSemaine}</b><span>inscrits</span></div></div>` +
      ((rdvJour.length + rappels.length) ? `<div style="padding:0 12px 6px"><button class="btn petit or" id="btnTourneeRappels">🧭 ${rdvJour.length + rappels.length > 1 ? `Mettre ces ${rdvJour.length + rappels.length} visites` : 'Mettre cette visite'} en tournée</button></div>` : '') +
      section('📅 RDV du jour', rdvJour, 'Pas de RDV aujourd’hui.') +
      section('⏰ Rappels à faire', rappels, 'Aucun rappel en retard. 👍') +
      section('🔥 Prospects chauds', chauds, 'Note le potentiel dans les fiches pour les voir ici.') +
      section('🗓️ Prochains rappels', aVenir, 'Rien de planifié.') +
      (topObj.length ? `<div class="section-titre">Objections les plus fréquentes</div>` +
        topObj.map(([o, n]) => `<div class="barre"><span>${esc(o)}</span><i style="width:${Math.round(n / maxObj * 120)}px"></i><b>${n}</b></div>`).join('') + '<div style="height:10px"></div>' : '');
  }

  if (panneauMode === 'tournee') {
    const etapes = tournee.map(id => parId.get(id)).filter(Boolean);
    let total = 0;
    etapes.forEach((c, i) => { if (i) total += distance(etapes[i - 1], c); });
    const troncons = [];
    for (let i = 0; i < etapes.length; i += 10) troncons.push([i, Math.min(i + 10, etapes.length)]);
    head.innerHTML = `<strong>Tournée · ${etapes.length} étapes</strong><span>≈ ${fmtDist(total * 1.3)}</span>${fermer}
      <div class="row" style="width:100%;flex-wrap:wrap;gap:6px">
        <button class="btn petit" id="btnOptimiser" ${etapes.length < 3 ? 'disabled' : ''}>⚡ Optimiser l’ordre</button>
        ${troncons.map(([a, b], i) => `<button class="btn petit or" data-gmaps="${i}">Google Maps ${troncons.length > 1 ? `${a + 1}–${b}` : ''}</button>`).join('')}
        ${etapes.length ? '<button class="btn petit" id="btnViderTournee">Vider</button>' : ''}
      </div>`;
    body.innerHTML = etapes.length
      ? etapes.map((c, i) => ligne(c, { num: i + 1, btns: true })).join('')
      : `<div class="vide" style="padding:14px 12px">Ajoute des commerces avec « ＋ Tournée » dans leur fiche, ou utilise 📍 Autour de moi → « Tournée des 10 plus proches ».<br><br>Les étapes sont ensuite ouvertes dans Google Maps, par tronçons de 10.</div>`;
  }
}

document.getElementById('panneau').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-fermer-panneau]')) return fermerPanneau();
  const mv = t.closest('[data-monter],[data-descendre],[data-retirer]');
  if (mv) {
    const id = mv.dataset.monter || mv.dataset.descendre || mv.dataset.retirer;
    const i = tournee.indexOf(id);
    if (mv.dataset.retirer) tournee.splice(i, 1);
    else {
      const j = mv.dataset.monter ? i - 1 : i + 1;
      if (j >= 0 && j < tournee.length) [tournee[i], tournee[j]] = [tournee[j], tournee[i]];
    }
    return sauverTournee();
  }
  if (t.closest('#btnOptimiser')) { optimiserTournee(); return toast('Ordre optimisé' + (maPos ? ' depuis ta position.' : '.')); }
  if (t.closest('#btnViderTournee')) { if (confirm('Vider la tournée ?')) { tournee = []; sauverTournee(); } return; }
  if (t.closest('#btnTourneeRappels')) {
    const auj = aujourdhui();
    const ids = commerces.filter(c => !STATUTS_CLOS.includes(statutDe(c.id)) && (rappelEchu(c.id) || (statutDe(c.id) === 'rdv' && etat(c.id).rappel === auj))).map(c => c.id);
    tournee = [...new Set([...tournee, ...ids])];
    optimiserTournee();
    return ouvrirPanneau('tournee');
  }
  const g = t.closest('[data-gmaps]');
  if (g) return ouvrirGoogleMaps(+g.dataset.gmaps);
  const it = t.closest('.item[data-id]');
  if (it) {
    const c = parId.get(it.dataset.id);
    map.flyTo([c.lat, c.lon], Math.max(map.getZoom(), 17), { duration: 0.6 });
    ouvrirFiche(c.id);
  }
});
map.on('moveend', () => { if (panneauMode === 'liste' && !maPos) rafraichirPanneau(); });

// ============================================================================
// Tournée
// ============================================================================
function sauverTournee() {
  ecrire(K.tournee, tournee);
  dessinerTournee(); majCompteurs(); rafraichirPanneau();
}
function basculerTournee(id) {
  if (tournee.includes(id)) tournee = tournee.filter(x => x !== id);
  else tournee.push(id);
  sauverTournee();
}
function dessinerTournee() {
  coucheTournee.clearLayers();
  const etapes = tournee.map(id => parId.get(id)).filter(Boolean);
  if (!etapes.length) return;
  L.polyline(etapes.map(c => [c.lat, c.lon]), { color: '#F4B942', weight: 3, dashArray: '6 8', interactive: false }).addTo(coucheTournee);
  etapes.forEach((c, i) => {
    L.marker([c.lat, c.lon], { icon: L.divIcon({ className: 'num-etape', html: String(i + 1), iconSize: [22, 22], iconAnchor: [11, 26] }), zIndexOffset: 1000 })
      .on('click', () => ouvrirFiche(c.id)).addTo(coucheTournee);
  });
}
function optimiserTournee() {
  const pts = tournee.map(id => parId.get(id)).filter(Boolean);
  if (pts.length < 3) return;
  // Plus proche voisin depuis ma position (ou la 1re étape), puis amélioration 2-opt.
  const depart = maPos || pts[0];
  const reste = [...pts], ordre = [];
  let cur = depart;
  while (reste.length) {
    let bi = 0, bd = Infinity;
    reste.forEach((p, i) => { const d = distance(cur, p); if (d < bd) { bd = d; bi = i; } });
    cur = reste.splice(bi, 1)[0]; ordre.push(cur);
  }
  const route = maPos ? [depart, ...ordre] : ordre;
  const d = (a, b) => distance(route[a], route[b]);
  let mieux = true, tours = 0;
  while (mieux && tours++ < 50) {
    mieux = false;
    for (let i = maPos ? 1 : 0; i < route.length - 2; i++) {
      for (let j = i + 2; j < route.length; j++) {
        const avant = (i > 0 ? d(i - 1, i) : 0) + (j + 1 < route.length ? d(j, j + 1) : 0);
        const apres = (i > 0 ? d(i - 1, j) : 0) + (j + 1 < route.length ? d(i, j + 1) : 0);
        if (apres + 0.1 < avant) { route.splice(i, j - i + 1, ...route.slice(i, j + 1).reverse()); mieux = true; }
      }
    }
  }
  tournee = (maPos ? route.slice(1) : route).map(c => c.id);
  sauverTournee();
}
function ouvrirGoogleMaps(troncon) {
  const etapes = tournee.map(id => parId.get(id)).filter(Boolean);
  const a = troncon * 10, morceau = etapes.slice(a, a + 10);
  if (!morceau.length) return;
  const pt = c => `${c.lat},${c.lon}`;
  const dest = morceau[morceau.length - 1];
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${pt(dest)}`;
  if (a > 0) url += `&origin=${pt(etapes[a - 1])}`;
  const via = morceau.slice(0, -1);
  if (via.length) url += `&waypoints=${encodeURIComponent(via.map(pt).join('|'))}`;
  window.open(url, '_blank', 'noopener');
}

// ============================================================================
// Autour de moi (géolocalisation)
// ============================================================================
let suiviPos = null;
function ouvrirRayon() {
  if (!filtres.rayon) filtres.rayon = 2000;
  document.getElementById('rayonRow').classList.add('open');
  document.getElementById('btnLoc').classList.add('on');
  rendreChips(); ajusterHautCarte();
  map.flyTo([maPos.lat, maPos.lon], 15);
  dessinerRayon(); appliquerFiltres();
}
document.getElementById('btnLoc').onclick = () => {
  const row = document.getElementById('rayonRow');
  if (row.classList.contains('open')) {
    row.classList.remove('open'); document.getElementById('btnLoc').classList.remove('on');
    filtres.rayon = 0; dessinerRayon(); rendreChips(); appliquerFiltres(); ajusterHautCarte();
    return;
  }
  if (maPos) return ouvrirRayon();
  if (!navigator.geolocation) return toast('Géolocalisation non disponible.');
  toast('Recherche de ta position…');
  if (suiviPos !== null) navigator.geolocation.clearWatch(suiviPos);
  suiviPos = navigator.geolocation.watchPosition(p => {
    const premier = !maPos;
    maPos = { lat: p.coords.latitude, lon: p.coords.longitude };
    if (!pointMoi) pointMoi = L.circleMarker([maPos.lat, maPos.lon], { radius: 7, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1, interactive: false }).addTo(map);
    else pointMoi.setLatLng([maPos.lat, maPos.lon]);
    if (premier) return ouvrirRayon();
    dessinerRayon();
    if (filtres.rayon) appliquerFiltres();
  }, () => { suiviPos = null; toast('Position refusée ou indisponible.'); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 20000 });
};
function dessinerRayon() {
  if (cercleRayon) { cercleRayon.remove(); cercleRayon = null; }
  if (maPos && filtres.rayon) cercleRayon = L.circle([maPos.lat, maPos.lon], { radius: filtres.rayon, color: '#2563eb', weight: 1, fillOpacity: 0.05, interactive: false }).addTo(map);
}
document.getElementById('chipsRayon').addEventListener('click', e => {
  if (!e.target.closest('#btnProches')) return;
  if (!maPos) return toast('Position inconnue.');
  const proches = commerces.filter(c => statutDe(c.id) === 'a_faire' && visible(c) && !tournee.includes(c.id))
    .sort((a, b) => distance(maPos, a) - distance(maPos, b)).slice(0, 10);
  if (!proches.length) return toast('Aucun commerce à démarcher dans ce rayon.');
  tournee = [...tournee, ...proches.map(c => c.id)];
  optimiserTournee(); sauverTournee();
  ouvrirPanneau('tournee');
});

// ============================================================================
// Synchronisation Supabase (compte admin) + file d'attente hors-ligne
// ============================================================================
let outbox = lire(K.outbox, {});       // id -> maj envoyée attendue (ou 'DEL')
let etatSync = 'off';
let tSync = null, syncEnCours = false;

function session() { return lire('session_admin', null); }

async function rafraichirSession() {
  const s = session();
  if (!s?.refresh_token) return false;
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!r.ok) return false;
    const d = await r.json();
    ecrire('session_admin', { ...s, access_token: d.access_token, refresh_token: d.refresh_token || s.refresh_token });
    return true;
  } catch { return false; }
}

async function sb(chemin, opts = {}, reessai = true) {
  const s = session();
  if (!s?.access_token) throw { code: 'auth' };
  const r = await fetch(SUPABASE_URL + chemin, {
    ...opts,
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (r.status === 401 && reessai && await rafraichirSession()) return sb(chemin, opts, false);
  if (r.status === 401 || r.status === 403) throw { code: 'auth' };
  if (r.status === 404) throw { code: 'table' };
  if (!r.ok) throw { code: 'http', status: r.status };
  return r.status === 204 || r.status === 201 ? null : r.json();
}

function marquerAEnvoyer(id, supprime) {
  outbox[id] = supprime ? 'DEL' : (suivi[id]?.maj || new Date().toISOString());
  ecrire(K.outbox, outbox);
  majBoutonSync();
  planifierSync(1500);
}
function planifierSync(ms) { clearTimeout(tSync); tSync = setTimeout(synchroniser, ms); }

function majBoutonSync() {
  const b = document.getElementById('btnSync');
  const n = Object.keys(outbox).length;
  const etats = {
    off:     ['☁︎<span class="hide-m"> Connexion</span>', '', 'Se connecter pour synchroniser entre appareils'],
    ok:      ['☁︎<span class="hide-m"> Synchro</span> ✓', 'sync-ok', 'Synchronisé'],
    attente: [`☁︎ ⏳${n}`, 'sync-attente', `${n} modification(s) en attente d’envoi`],
    horsligne: [`☁︎ ⏸${n || ''}`, 'sync-attente', 'Hors ligne : les modifications partiront au retour du réseau'],
    table:   ['☁︎ ⚠', 'sync-erreur', 'Synchronisation pas encore activée côté base'],
    auth:    ['☁︎ 🔒', 'sync-erreur', 'Session expirée ou compte non admin : reconnecte-toi'],
    erreur:  [`☁︎ ⚠${n || ''}`, 'sync-erreur', 'Erreur de synchronisation, nouvel essai bientôt']
  };
  const [html, cls, titre] = etats[etatSync === 'ok' && n ? 'attente' : etatSync];
  b.innerHTML = html; b.className = 'btn ' + cls; b.title = titre;
}

function appliquerDistant(rows) {
  let change = false;
  for (const r of rows) {
    if (r.supprime) {
      if (r.commerce || ajouts.some(a => a.id === r.id)) {
        ajouts = ajouts.filter(a => a.id !== r.id);
        retirerCommerce(r.id);
      }
      delete suivi[r.id]; delete outbox[r.id];
      change = true; continue;
    }
    const local = suivi[r.id];
    if (!local || (r.suivi?.maj || '') > (local.maj || '')) {
      suivi[r.id] = r.suivi || {};
      delete outbox[r.id];                // la version distante est plus récente : on n'écrase pas
      change = true;
    }
    if (r.commerce && !ajouts.some(a => a.id === r.id)) { ajouts.push(r.commerce); change = true; }
    if (r.commerce && commerces.length && !parId.has(r.id)) { ajouterCommerce({ source: 'manuel', ...r.commerce }); change = true; }
  }
  if (change) {
    ecrire(K.suivi, suivi); ecrire(K.ajouts, ajouts); ecrire(K.outbox, outbox);
    commerces.forEach(c => rafraichirMarqueur(c.id));
    majCompteurs(); rafraichirPanneau(); dessinerTournee();
    const saisie = ['ficheMemo', 'ficheContact'].includes(document.activeElement?.id);
    if (selection && parId.has(selection)) rendreFiche(saisie);
  }
}

async function synchroniser() {
  if (syncEnCours) return planifierSync(2000);
  if (!session()?.access_token) { etatSync = 'off'; return majBoutonSync(); }
  if (!navigator.onLine) { etatSync = 'horsligne'; return majBoutonSync(); }
  syncEnCours = true;
  try {
    // 1) Récupérer ce qui a changé ailleurs depuis la dernière synchro.
    const premiereFois = !lire(K.curseur, null);
    let curseur = lire(K.curseur, '1970-01-01T00:00:00Z');
    for (;;) {
      const rows = await sb(`/rest/v1/prospection?select=id,suivi,commerce,supprime,updated_at&updated_at=gt.${encodeURIComponent(curseur)}&order=updated_at.asc&limit=1000`);
      if (!rows.length) break;
      appliquerDistant(rows);
      curseur = rows[rows.length - 1].updated_at;
      ecrire(K.curseur, curseur);
      if (rows.length < 1000) break;
    }
    if (premiereFois) {
      // Première connexion de cet appareil : on envoie le suivi déjà saisi en local.
      Object.keys(suivi).forEach(id => { if (!outbox[id]) outbox[id] = suivi[id].maj || ''; });
      ecrire(K.curseur, curseur);
    }
    // 2) Envoyer les modifications locales.
    const ids = Object.keys(outbox);
    for (let i = 0; i < ids.length; i += 200) {
      const lot = ids.slice(i, i + 200);
      const envoye = {};
      const rows = lot.map(id => {
        envoye[id] = outbox[id];
        const ajout = ajouts.find(a => a.id === id) || null;
        return { id, suivi: suivi[id] || {}, commerce: ajout, supprime: outbox[id] === 'DEL' };
      });
      await sb('/rest/v1/prospection?on_conflict=id', {
        method: 'POST', body: JSON.stringify(rows),
        headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }
      });
      lot.forEach(id => { if (outbox[id] === envoye[id]) delete outbox[id]; });
      ecrire(K.outbox, outbox);
    }
    etatSync = 'ok';
  } catch (e) {
    etatSync = e?.code === 'auth' ? 'auth' : e?.code === 'table' ? 'table' : navigator.onLine ? 'erreur' : 'horsligne';
    if (etatSync === 'erreur') planifierSync(30000);
  } finally {
    syncEnCours = false;
    majBoutonSync();
  }
}

document.getElementById('btnSync').onclick = () => {
  if (!session()?.access_token || etatSync === 'auth') {
    if (confirm('Se connecter avec le compte admin Marchéo pour synchroniser le suivi entre ton téléphone et ton ordinateur ?'))
      location.href = '/admin?redirect=' + encodeURIComponent('/prospection');
    return;
  }
  if (etatSync === 'table') return toast('La table de synchronisation n’existe pas encore dans la base : le suivi reste enregistré sur cet appareil.');
  toast('Synchronisation…');
  synchroniser().then(() => toast(document.getElementById('btnSync').title));
};
window.addEventListener('online', () => synchroniser());
window.addEventListener('offline', () => { etatSync = 'horsligne'; majBoutonSync(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') synchroniser(); });
setInterval(() => { if (document.visibilityState === 'visible') synchroniser(); }, 60000);

// ============================================================================
// Ajout manuel
// ============================================================================
function ajouterCommerce(c) {
  commerces.push(c); parId.set(c.id, c); creerMarqueur(c); rafraichirMarqueur(c.id);
}
function retirerCommerce(id) {
  commerces = commerces.filter(c => c.id !== id); parId.delete(id);
  marqueurs.get(id)?.remove(); marqueurs.delete(id);
  tournee = tournee.filter(x => x !== id); ecrire(K.tournee, tournee);
  if (selection === id) fermerFiche();
}
document.getElementById('btnAjout').onclick = () => {
  modeAjout = !modeAjout;
  document.body.classList.toggle('mode-ajout', modeAjout);
  document.getElementById('btnAjout').classList.toggle('on', modeAjout);
  if (modeAjout) toast('Touche la carte à l’emplacement du commerce à ajouter.');
};
map.on('click', e => {
  if (!modeAjout) return;
  modeAjout = false; document.body.classList.remove('mode-ajout'); document.getElementById('btnAjout').classList.remove('on');
  const nom = prompt('Nom du commerce ?'); if (!nom) return;
  const choix = Object.values(CATEGORIES).map((c, i) => `${i + 1}. ${c.label}`).join('\n');
  const n = parseInt(prompt('Catégorie (numéro) :\n' + choix, '1'), 10);
  const cat = Object.keys(CATEGORIES)[(n || 1) - 1] || 'autre';
  const ville = prompt('Ville ?', '') || '';
  const c = { id: 'custom/' + Date.now().toString(36), source: 'manuel', nom, cat, lat: e.latlng.lat, lon: e.latlng.lng, ville, adresse: ville, tel: '', web: '', email: '', horaires: '', chaine: false, marque: '' };
  ajouts.push(c); ecrire(K.ajouts, ajouts);
  ajouterCommerce(c);
  majSuivi(c.id, {}, 'Commerce ajouté à la main');
  ouvrirFiche(c.id);
});
document.getElementById('btnSupprimer').onclick = () => {
  if (!selection || !confirm('Supprimer ce commerce ajouté et son suivi ?')) return;
  const id = selection; fermerFiche();
  ajouts = ajouts.filter(a => a.id !== id); ecrire(K.ajouts, ajouts);
  retirerCommerce(id);
  delete suivi[id]; ecrire(K.suivi, suivi);
  marquerAEnvoyer(id, true);
  majCompteurs(); dessinerTournee();
};

// ============================================================================
// Export / import
// ============================================================================
function telecharger(nom, contenu, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenu], { type }));
  a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.getElementById('btnExportCsv').onclick = () => {
  const cols = ['Nom', 'Catégorie', 'Chaîne', 'Dirigeant', 'Raison sociale', 'SIRET', 'Adresse', 'Ville', 'Téléphone', 'Email', 'Site',
    'Statut', 'Potentiel', 'Objections', 'Contact', 'Rappel', 'Heure', 'Mémo', 'Dernière visite', 'Dernière modif', 'Source', 'Latitude', 'Longitude', 'Id'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lignes = commerces.filter(visible).map(c => {
    const e = etat(c.id), p = potentielDe(c.id);
    return [c.nom, CATEGORIES[c.cat].label, c.chaine ? c.marque || 'oui' : '', c.dirigeant, c.raison, c.siret, c.adresse, c.ville, c.tel, c.email, c.web,
      STATUTS[statutDe(c.id)].label, p === 'aucun' ? '' : POTENTIELS[p].label.replace(/^\S+\s/, ''), (e.objections || []).join(' | '), e.contact, e.rappel, e.heure, e.memo,
      e.visite ? new Date(e.visite).toLocaleDateString('fr-FR') : '', e.maj ? new Date(e.maj).toLocaleString('fr-FR') : '',
      SOURCES[c.source || 'osm'], c.lat, c.lon, c.id].map(q).join(';');
  });
  telecharger(`prospection-${aujourdhui()}.csv`, '﻿' + [cols.map(q).join(';'), ...lignes].join('\n'), 'text/csv;charset=utf-8');
};
document.getElementById('btnExportJson').onclick = () => {
  telecharger(`prospection-sauvegarde-${aujourdhui()}.json`, JSON.stringify({ version: 2, date: new Date().toISOString(), suivi, ajouts, tournee }, null, 1), 'application/json');
};
document.getElementById('btnImport').onclick = () => document.getElementById('fichierImport').click();
document.getElementById('fichierImport').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.suivi) throw new Error('format');
    if (!confirm(`Fusionner la sauvegarde du ${new Date(d.date).toLocaleString('fr-FR')} ? (la version la plus récente de chaque fiche est conservée)`)) return;
    for (const [id, v] of Object.entries(d.suivi)) {
      if (!suivi[id] || (v.maj || '') > (suivi[id].maj || '')) { suivi[id] = v; outbox[id] = v.maj || ''; }
    }
    const ids = new Set(ajouts.map(a => a.id));
    (d.ajouts || []).forEach(a => { if (!ids.has(a.id)) { ajouts.push({ source: 'manuel', ...a }); outbox[a.id] = suivi[a.id]?.maj || ''; } });
    if (!tournee.length && d.tournee) ecrire(K.tournee, d.tournee);
    ecrire(K.suivi, suivi); ecrire(K.ajouts, ajouts); ecrire(K.outbox, outbox);
    location.reload();
  } catch { toast('Fichier de sauvegarde invalide.'); }
  e.target.value = '';
};
document.getElementById('btnMaj').onclick = () => {
  if (confirm('Recharger tous les commerces (OpenStreetMap + registre des entreprises) ? Compte ~1 minute. Ton suivi est conservé.')) demarrer(true);
};

// ============================================================================
// Divers
// ============================================================================
let tToast;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('show'), 4000);
}
function afficherChargement(txt) {
  document.getElementById('chargementTxt').textContent = txt;
  document.getElementById('chargement').style.display = 'flex';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fermerFiche(); } });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/prospection-sw.js', { scope: '/prospection' }).catch(() => {});
}

// ============================================================================
// Démarrage
// ============================================================================
async function demarrer(force) {
  afficherChargement('Récupération des commerces sur OpenStreetMap…');
  const [osm, sirene] = await Promise.allSettled([chargerOsm(force), chargerSirene(force)]);
  const liste = fusionner(osm.value?.liste || [], sirene.value?.liste || []);
  if (osm.status === 'rejected' && sirene.status === 'rejected') toast('Impossible de charger les commerces (connexion ?). Réessaie avec « Actualiser ».');
  else if (osm.status === 'rejected') toast('OpenStreetMap indisponible : seul le registre des entreprises est affiché.');
  else if (sirene.status === 'rejected') toast('Registre des entreprises indisponible : seul OpenStreetMap est affiché.');
  else if (force) toast(`${liste.length} commerces chargés.`);

  marqueurs.forEach(m => m.remove()); marqueurs.clear();
  const manuels = ajouts.map(a => ({ source: 'manuel', ...a }));
  commerces = [...liste, ...manuels];
  parId = new Map(commerces.map(c => [c.id, c]));
  commerces.forEach(creerMarqueur);
  rendreChips(); appliquerFiltres(); dessinerTournee(); ajusterHautCarte(); majBoutonSync();
  document.getElementById('chargement').style.display = 'none';
  synchroniser();
}
ajusterHautCarte();
demarrer(false);
