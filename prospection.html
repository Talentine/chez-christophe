<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0A1428">
<title>Prospection — Marchéo</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #080F1F; --panel: #0F1A33; --panel-2: #15244A; --line: rgba(255,255,255,0.10);
    --txt: #fff; --txt-2: rgba(255,255,255,0.62); --or: #F4B942; --vert-fonce: #0A1428;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Inter', 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--txt); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  #map { position: absolute; inset: 0; z-index: 1; background: #dde3ea; }

  /* ---------- Barre du haut ---------- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
    background: linear-gradient(180deg, rgba(8,15,31,0.97), rgba(8,15,31,0.90));
    border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .titre { font-family: 'Manrope', system-ui, sans-serif; font-weight: 700; font-size: 16px; white-space: nowrap; }
  .titre span { color: var(--or); }
  .sous { font-size: 12px; color: var(--txt-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 13px; white-space: nowrap; min-height: 38px;
  }
  .btn:hover { border-color: rgba(255,255,255,0.25); }
  .btn.or { background: var(--or); color: var(--vert-fonce); border-color: var(--or); font-weight: 600; }
  .btn.on { border-color: var(--or); color: var(--or); }
  .search {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 14px; min-height: 38px; outline: none;
  }
  .search:focus { border-color: var(--or); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 5px 10px; font-size: 12px; background: var(--panel); border: 1px solid var(--line);
    color: var(--txt-2); white-space: nowrap;
  }
  .chip.on { color: var(--txt); border-color: rgba(255,255,255,0.35); background: var(--panel-2); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip b { font-weight: 600; color: var(--txt); }
  .filtres { display: none; }
  .filtres.open { display: block; }

  /* ---------- Fiche commerce ---------- */
  .fiche {
    position: absolute; z-index: 1100; right: 12px; top: var(--top-h, 110px); bottom: 12px; width: 380px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45); display: none; flex-direction: column; overflow: hidden;
  }
  .fiche.open { display: flex; }
  .fiche-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); position: relative; }
  .fiche-head .bandeau { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .fiche-nom { font-family: 'Manrope', system-ui, sans-serif; font-size: 19px; font-weight: 700; padding-right: 36px; line-height: 1.25; }
  .fiche-cat { font-size: 13px; color: var(--txt-2); margin-top: 4px; }
  .fermer { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); font-size: 16px; }
  .fiche-body { padding: 14px 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .infos { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--txt-2); }
  .infos a { color: var(--or); text-decoration: none; overflow-wrap: anywhere; }
  a.btn { color: var(--txt); text-decoration: none; display: inline-flex; align-items: center; }
  a.btn.or { color: var(--vert-fonce); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a { text-decoration: none; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--txt-2); margin-bottom: 8px; font-weight: 600; }
  .statuts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .statut {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px;
    background: var(--panel-2); border: 1.5px solid transparent; font-size: 13px; text-align: left; min-height: 40px;
  }
  .statut .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .statut.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel-2)); }
  .couleurs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--line); }
  .sw.on { border-color: #fff; }
  .sw.auto { background: conic-gradient(#64748b, #3b82f6, #f59e0b, #8b5cf6, #10b981, #dc2626, #64748b); font-size: 0; }
  textarea, .champ {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none;
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
  textarea:focus, .champ:focus { border-color: var(--or); }
  .champ { min-height: 40px; color-scheme: dark; }
  .save-state { font-size: 11px; color: var(--txt-2); margin-top: 6px; height: 14px; }
  .histo { font-size: 12px; color: var(--txt-2); display: flex; flex-direction: column; gap: 4px; }
  .histo div { display: flex; gap: 8px; }
  .histo time { flex: none; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; }

  /* ---------- Liste ---------- */
  .liste {
    position: absolute; z-index: 1050; left: 12px; bottom: 12px; width: 360px; max-height: calc(100% - var(--top-h, 110px) - 12px);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45); display: none; flex-direction: column; overflow: hidden;
  }
  .liste.open { display: flex; }
  .liste-head { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--txt-2); display: flex; align-items: center; gap: 8px; }
  .liste-body { overflow-y: auto; }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
  .item:hover { background: var(--panel-2); }
  .item .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; flex: none; }
  .item-nom { font-size: 14px; font-weight: 600; }
  .item-sous { font-size: 12px; color: var(--txt-2); margin-top: 2px; }
  .item-memo { font-size: 12px; color: var(--or); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }

  /* ---------- Divers ---------- */
  .toast {
    position: absolute; z-index: 1300; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; display: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { display: block; }
  .chargement {
    position: absolute; inset: 0; z-index: 1200; display: flex; align-items: center; justify-content: center;
    background: rgba(8,15,31,0.65); font-size: 14px; flex-direction: column; gap: 12px;
  }
  .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--or); border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .mode-ajout #map { cursor: crosshair; }
  .leaflet-tooltip.tt { background: var(--panel); color: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; padding: 4px 8px; box-shadow: none; }
  .leaflet-tooltip.tt::before { display: none; }
  .leaflet-top.leaflet-left { top: var(--top-h, 110px); }
  .leaflet-control-attribution { font-size: 10px; }

  @media (max-width: 720px) {
    .titre-bloc .sous { display: none; }
    .hide-m { display: none; }
    .fiche { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 78vh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    .liste { left: 0; right: 0; bottom: 0; width: auto; border-radius: 18px 18px 0 0; max-height: 60vh; }
    .leaflet-top.leaflet-left { display: none; }
  }
</style>
</head>
<body>

<div id="map"></div>

<header class="topbar" id="topbar">
  <div class="row">
    <div class="titre-bloc" style="min-width:0">
      <div class="titre">Prospection <span>Deauville → Caen</span></div>
      <div class="sous" id="sousTitre">Commerces de bouche · chargement…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnLoc" title="Me localiser">📍<span class="hide-m"> Moi</span></button>
    <button class="btn" id="btnListe" title="Liste">☰<span class="hide-m"> Liste</span></button>
    <button class="btn" id="btnFiltres" title="Filtres">⚙︎<span class="hide-m"> Filtres</span></button>
  </div>
  <div class="row" style="margin-top:8px">
    <input class="search" id="recherche" type="search" placeholder="Rechercher un nom, une ville, un mémo…" autocomplete="off">
  </div>
  <div class="chips" id="chipsStatuts"></div>
  <div class="filtres" id="panneauFiltres">
    <div class="chips" id="chipsCats"></div>
    <div class="chips">
      <button class="chip" id="chipChaines">Masquer les chaînes</button>
      <button class="chip" id="chipMemo">Avec mémo seulement</button>
      <button class="chip" id="chipRappel">Rappels échus</button>
      <button class="chip" id="btnAjout">＋ Ajouter un commerce</button>
      <button class="chip" id="btnMaj">↻ Actualiser les données</button>
      <button class="chip" id="btnExportCsv">⬇ Export CSV</button>
      <button class="chip" id="btnExportJson">⬇ Sauvegarde</button>
      <button class="chip" id="btnImport">⬆ Restaurer</button>
      <input type="file" id="fichierImport" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<aside class="liste" id="liste">
  <div class="liste-head"><span id="listeTitre"></span><div class="spacer"></div><button class="btn" id="fermerListe">✕</button></div>
  <div class="liste-body" id="listeBody"></div>
</aside>

<aside class="fiche" id="fiche">
  <div class="fiche-head">
    <div class="bandeau" id="ficheBandeau"></div>
    <div class="fiche-nom" id="ficheNom"></div>
    <div class="fiche-cat" id="ficheCat"></div>
    <button class="fermer" id="fermerFiche" aria-label="Fermer">✕</button>
  </div>
  <div class="fiche-body">
    <div class="infos" id="ficheInfos"></div>
    <div class="actions" id="ficheActions"></div>
    <div>
      <div class="lbl">Statut</div>
      <div class="statuts" id="ficheStatuts"></div>
    </div>
    <div>
      <div class="lbl">Couleur du repère</div>
      <div class="couleurs" id="ficheCouleurs"></div>
    </div>
    <div>
      <div class="lbl">Mémo</div>
      <textarea id="ficheMemo" placeholder="Nom du gérant, horaires de passage, objections, intérêt…"></textarea>
      <div class="save-state" id="saveState"></div>
    </div>
    <div class="row">
      <div style="flex:1">
        <div class="lbl">Contact (gérant)</div>
        <input class="champ" id="ficheContact" placeholder="Nom, tél. direct…">
      </div>
      <div style="flex:1">
        <div class="lbl">Date de rappel</div>
        <input class="champ" id="ficheRappel" type="date">
      </div>
    </div>
    <div>
      <div class="lbl">Historique</div>
      <div class="histo" id="ficheHisto"></div>
    </div>
    <button class="btn" id="btnSupprimer" style="display:none;align-self:flex-start">Supprimer ce commerce ajouté</button>
  </div>
</aside>

<div class="chargement" id="chargement"><div class="spin"></div><div id="chargementTxt">Chargement des commerces…</div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Zone couverte : de Caen (ouest/sud) à Deauville-Trouville / Pont-l'Évêque (est), côte comprise.
const BBOX = { sud: 49.08, ouest: -0.50, nord: 49.43, est: 0.22 };

const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];

const CATEGORIES = {
  boulangerie:  { label: 'Boulangerie',        emoji: '🥖' },
  patisserie:   { label: 'Pâtisserie',         emoji: '🍰' },
  boucherie:    { label: 'Boucherie',          emoji: '🥩' },
  charcuterie:  { label: 'Charcuterie / Traiteur', emoji: '🥓' },
  fromagerie:   { label: 'Fromagerie / Crèmerie', emoji: '🧀' },
  poissonnerie: { label: 'Poissonnerie',       emoji: '🐟' },
  primeur:      { label: 'Primeur',            emoji: '🥕' },
  ferme:        { label: 'Vente à la ferme',   emoji: '🚜' },
  caviste:      { label: 'Caviste / Cidre',    emoji: '🍷' },
  chocolatier:  { label: 'Chocolatier / Confiserie', emoji: '🍫' },
  epicerie:     { label: 'Épicerie fine / Bio', emoji: '🫙' },
  cafe_the:     { label: 'Café / Thé',         emoji: '☕' },
  marche:       { label: 'Marché',             emoji: '🧺' },
  autre:        { label: 'Autre',              emoji: '📍' }
};

const STATUTS = {
  a_faire:  { label: 'À démarcher',   couleur: '#64748b' },
  visite:   { label: 'Visité',        couleur: '#3b82f6' },
  rappeler: { label: 'À rappeler',    couleur: '#f59e0b' },
  rdv:      { label: 'RDV pris',      couleur: '#8b5cf6' },
  interesse:{ label: 'Intéressé',     couleur: '#06b6d4' },
  signe:    { label: 'Inscrit ✓',     couleur: '#16a34a' },
  refus:    { label: 'Pas intéressé', couleur: '#dc2626' },
  hors:     { label: 'Fermé / hors cible', couleur: '#111827' }
};

const COULEURS_LIBRES = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#a855f7', '#ec4899', '#ffffff', '#000000'];

const K_SUIVI = 'prospection.suivi.v1';
const K_CACHE = 'prospection.osm.v1';
const K_AJOUTS = 'prospection.ajouts.v1';
const K_FILTRES = 'prospection.filtres.v1';

// ---------- Stockage (tolérant aux navigateurs privés) ----------
function lire(k, defaut) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : defaut; } catch { return defaut; } }
function ecrire(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch { toast('⚠️ Sauvegarde locale impossible (navigation privée ?) — exporte une sauvegarde.'); return false; }
}

let suivi = lire(K_SUIVI, {});          // id -> { statut, couleur, memo, contact, rappel, maj, histo:[{d,t}] }
let ajouts = lire(K_AJOUTS, []);        // commerces ajoutés à la main
let commerces = [];                     // liste fusionnée OSM + ajouts
const marqueurs = new Map();            // id -> L.circleMarker
let selection = null;
let modeAjout = false;

const filtres = Object.assign({
  statuts: Object.keys(STATUTS),
  cats: Object.keys(CATEGORIES),
  masquerChaines: false,
  memoSeul: false,
  rappelEchu: false
}, lire(K_FILTRES, {}));
let recherche = '';

// ---------- Carte ----------
const map = L.map('map', { zoomControl: true, preferCanvas: true })
  .fitBounds([[BBOX.sud, BBOX.ouest], [BBOX.nord, BBOX.est]]);
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
  maxZoom: 20, subdomains: 'abc',
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
L.rectangle([[BBOX.sud, BBOX.ouest], [BBOX.nord, BBOX.est]], { color: '#F4B942', weight: 1, fill: false, dashArray: '6 6', interactive: false }).addTo(map);
const canvas = L.canvas({ padding: 0.5, tolerance: 6 });

function ajusterHautCarte() {
  document.documentElement.style.setProperty('--top-h', (document.getElementById('topbar').offsetHeight + 10) + 'px');
}
window.addEventListener('resize', ajusterHautCarte);

// ---------- Données OSM ----------
function requeteOverpass() {
  const b = `${BBOX.sud},${BBOX.ouest},${BBOX.nord},${BBOX.est}`;
  return `[out:json][timeout:90];
(
  nwr["shop"~"^(bakery|pastry|butcher|deli|delicatessen|cheese|dairy|seafood|fish|greengrocer|farm|wine|alcohol|beverages|cider|chocolate|confectionery|coffee|tea|spices|caterer|health_food|organic|honey|food)$"](${b});
  nwr["craft"~"^(caterer|confectionery|bakery|cider|cider_maker|brewery|distillery|winery|cheese_maker)$"](${b});
  nwr["amenity"="marketplace"](${b});
);
out center tags;`;
}

function categorie(t) {
  const s = t.shop, c = t.craft;
  if (t.amenity === 'marketplace') return 'marche';
  if (s === 'bakery' || c === 'bakery') return 'boulangerie';
  if (s === 'pastry') return 'patisserie';
  if (s === 'butcher') return 'boucherie';
  if (s === 'deli' || s === 'caterer' || c === 'caterer') return 'charcuterie';
  if (s === 'cheese' || s === 'dairy' || c === 'cheese_maker') return 'fromagerie';
  if (s === 'seafood' || s === 'fish') return 'poissonnerie';
  if (s === 'greengrocer') return 'primeur';
  if (s === 'farm') return 'ferme';
  if (['wine', 'alcohol', 'beverages', 'cider'].includes(s) || ['cider', 'cider_maker', 'brewery', 'distillery', 'winery'].includes(c)) return 'caviste';
  if (s === 'chocolate' || s === 'confectionery' || c === 'confectionery') return 'chocolatier';
  if (s === 'coffee' || s === 'tea') return 'cafe_the';
  if (['delicatessen', 'spices', 'health_food', 'organic', 'honey', 'food'].includes(s)) return 'epicerie';
  return 'autre';
}

function normaliser(el) {
  const t = el.tags || {};
  const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
  if (lat == null || lon == null) return null;
  const cat = categorie(t);
  const adresse = [[t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' '), [t['addr:postcode'], t['addr:city']].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  return {
    id: `${el.type}/${el.id}`,
    nom: t.name || t.brand || `${CATEGORIES[cat].label} (sans nom)`,
    cat, lat, lon,
    ville: t['addr:city'] || '',
    adresse,
    tel: t.phone || t['contact:phone'] || '',
    web: t.website || t['contact:website'] || '',
    email: t.email || t['contact:email'] || '',
    horaires: t.opening_hours || '',
    chaine: !!(t.brand || t['brand:wikidata']),
    marque: t.brand || ''
  };
}

async function chargerOSM(force) {
  const cache = lire(K_CACHE, null);
  if (cache && !force) { return cache; }
  afficherChargement('Récupération des commerces sur OpenStreetMap…');
  const corps = 'data=' + encodeURIComponent(requeteOverpass());
  let derniereErreur;
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: 'POST', body: corps, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const json = await r.json();
      const vus = new Set();
      const liste = json.elements.map(normaliser).filter(c => c && !vus.has(c.id) && vus.add(c.id));
      const data = { date: new Date().toISOString(), liste };
      ecrire(K_CACHE, data);
      return data;
    } catch (e) { derniereErreur = e; }
  }
  if (cache) { toast('Serveur OSM indisponible — données en cache utilisées.'); return cache; }
  throw derniereErreur;
}

// ---------- Logique suivi ----------
function etat(id) { return suivi[id] || {}; }
function statutDe(id) { return etat(id).statut || 'a_faire'; }
function couleurDe(id) { return etat(id).couleur || STATUTS[statutDe(id)].couleur; }
function aujourdhui() { return new Date().toISOString().slice(0, 10); }
function rappelEchu(id) { const r = etat(id).rappel; return !!r && r <= aujourdhui(); }

function majSuivi(id, patch, note) {
  const e = Object.assign({}, etat(id), patch, { maj: new Date().toISOString() });
  if (note) e.histo = [{ d: e.maj, t: note }, ...(e.histo || [])].slice(0, 50);
  suivi[id] = e;
  ecrire(K_SUIVI, suivi);
  rafraichirMarqueur(id);
  majCompteurs();
}

function visible(c) {
  if (!filtres.cats.includes(c.cat)) return false;
  if (!filtres.statuts.includes(statutDe(c.id))) return false;
  if (filtres.masquerChaines && c.chaine) return false;
  if (filtres.memoSeul && !(etat(c.id).memo || '').trim()) return false;
  if (filtres.rappelEchu && !rappelEchu(c.id)) return false;
  if (recherche) {
    const e = etat(c.id);
    const h = `${c.nom} ${c.ville} ${c.adresse} ${c.marque} ${CATEGORIES[c.cat].label} ${e.memo || ''} ${e.contact || ''}`.toLowerCase();
    if (!recherche.split(/\s+/).every(m => h.includes(m))) return false;
  }
  return true;
}

// ---------- Marqueurs ----------
function creerMarqueur(c) {
  const m = L.circleMarker([c.lat, c.lon], { renderer: canvas, radius: 8, weight: 2, color: '#fff', fillOpacity: 0.95 });
  m.bindTooltip(() => `${CATEGORIES[c.cat].emoji} ${esc(c.nom)}`, { className: 'tt', direction: 'top', offset: [0, -6] });
  m.on('click', () => ouvrirFiche(c.id));
  marqueurs.set(c.id, m);
  return m;
}

function rafraichirMarqueur(id) {
  const c = commerces.find(x => x.id === id), m = marqueurs.get(id);
  if (!c || !m) return;
  const sel = selection === id;
  m.setStyle({
    fillColor: couleurDe(id),
    color: sel ? '#F4B942' : (rappelEchu(id) ? '#f59e0b' : '#ffffff'),
    weight: sel ? 4 : (rappelEchu(id) ? 3 : 2),
    radius: sel ? 11 : 8
  });
  if (visible(c)) { if (!map.hasLayer(m)) m.addTo(map); if (sel) m.bringToFront(); }
  else if (map.hasLayer(m)) m.remove();
}

function appliquerFiltres() {
  commerces.forEach(c => rafraichirMarqueur(c.id));
  majCompteurs();
  if (document.getElementById('liste').classList.contains('open')) rendreListe();
  ecrire(K_FILTRES, filtres);
}

// ---------- Barre de filtres ----------
function rendreChips() {
  const cs = document.getElementById('chipsStatuts');
  cs.innerHTML = Object.entries(STATUTS).map(([k, s]) =>
    `<button class="chip ${filtres.statuts.includes(k) ? 'on' : ''}" data-statut="${k}"><span class="dot" style="background:${s.couleur}"></span>${s.label} <b data-n="${k}">0</b></button>`
  ).join('');
  const cc = document.getElementById('chipsCats');
  cc.innerHTML = Object.entries(CATEGORIES).map(([k, c]) =>
    `<button class="chip ${filtres.cats.includes(k) ? 'on' : ''}" data-cat="${k}">${c.emoji} ${c.label} <b data-c="${k}">0</b></button>`
  ).join('');
  document.getElementById('chipChaines').classList.toggle('on', filtres.masquerChaines);
  document.getElementById('chipMemo').classList.toggle('on', filtres.memoSeul);
  document.getElementById('chipRappel').classList.toggle('on', filtres.rappelEchu);
}

function basculer(liste, k, tous) {
  // Premier clic quand tout est coché : n'afficher que celui-ci. Sinon bascule normale.
  if (liste.length === tous.length) return [k];
  const r = liste.includes(k) ? liste.filter(x => x !== k) : [...liste, k];
  return r.length ? r : [...tous];
}

document.getElementById('chipsStatuts').addEventListener('click', e => {
  const b = e.target.closest('[data-statut]'); if (!b) return;
  filtres.statuts = basculer(filtres.statuts, b.dataset.statut, Object.keys(STATUTS));
  rendreChips(); appliquerFiltres();
});
document.getElementById('chipsCats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  filtres.cats = basculer(filtres.cats, b.dataset.cat, Object.keys(CATEGORIES));
  rendreChips(); appliquerFiltres();
});
document.getElementById('chipChaines').onclick = () => { filtres.masquerChaines = !filtres.masquerChaines; rendreChips(); appliquerFiltres(); };
document.getElementById('chipMemo').onclick = () => { filtres.memoSeul = !filtres.memoSeul; rendreChips(); appliquerFiltres(); };
document.getElementById('chipRappel').onclick = () => { filtres.rappelEchu = !filtres.rappelEchu; rendreChips(); appliquerFiltres(); };
document.getElementById('btnFiltres').onclick = e => {
  document.getElementById('panneauFiltres').classList.toggle('open');
  e.currentTarget.classList.toggle('on');
  ajusterHautCarte();
};
let tRech;
document.getElementById('recherche').addEventListener('input', e => {
  clearTimeout(tRech);
  tRech = setTimeout(() => { recherche = e.target.value.trim().toLowerCase(); appliquerFiltres(); }, 150);
});

function majCompteurs() {
  const nS = {}, nC = {};
  let vis = 0;
  commerces.forEach(c => {
    nS[statutDe(c.id)] = (nS[statutDe(c.id)] || 0) + 1;
    nC[c.cat] = (nC[c.cat] || 0) + 1;
    if (visible(c)) vis++;
  });
  document.querySelectorAll('[data-n]').forEach(b => b.textContent = nS[b.dataset.n] || 0);
  document.querySelectorAll('[data-c]').forEach(b => b.textContent = nC[b.dataset.c] || 0);
  const faits = commerces.length - (nS.a_faire || 0);
  const cache = lire(K_CACHE, null);
  document.getElementById('sousTitre').textContent =
    `${vis} affichés / ${commerces.length} commerces · ${faits} démarchés · ${nS.signe || 0} inscrits` +
    (cache ? ` · données OSM du ${new Date(cache.date).toLocaleDateString('fr-FR')}` : '');
}

// ---------- Fiche ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function ouvrirFiche(id) {
  const c = commerces.find(x => x.id === id); if (!c) return;
  const ancienne = selection;
  selection = id;
  if (ancienne) rafraichirMarqueur(ancienne);
  rafraichirMarqueur(id);
  const e = etat(id);

  document.getElementById('ficheNom').textContent = c.nom;
  document.getElementById('ficheCat').textContent =
    `${CATEGORIES[c.cat].emoji} ${CATEGORIES[c.cat].label}` + (c.chaine ? ` · chaîne${c.marque ? ' (' + c.marque + ')' : ''}` : '') + (c.manuel ? ' · ajouté à la main' : '');
  document.getElementById('ficheBandeau').style.background = couleurDe(id);

  const web = c.web && !/^https?:\/\//.test(c.web) ? 'https://' + c.web : c.web;
  document.getElementById('ficheInfos').innerHTML = [
    c.adresse && `📫 ${esc(c.adresse)}`,
    c.tel && `📞 <a href="tel:${esc(c.tel.replace(/\s/g, ''))}">${esc(c.tel)}</a>`,
    c.email && `✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,
    web && `🌐 <a href="${esc(web)}" target="_blank" rel="noopener">${esc(c.web)}</a>`,
    c.horaires && `🕒 ${esc(c.horaires)}`
  ].filter(Boolean).map(l => `<div>${l}</div>`).join('') || '<div>Pas de coordonnées dans OpenStreetMap.</div>';

  const q = encodeURIComponent(`${c.nom} ${c.adresse || c.ville}`);
  document.getElementById('ficheActions').innerHTML = `
    <a class="btn or" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}" target="_blank" rel="noopener">🧭 Itinéraire</a>
    <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">🔎 Google</a>
    ${c.tel ? `<a class="btn" href="tel:${esc(c.tel.replace(/\s/g, ''))}">📞 Appeler</a>` : ''}
    ${c.id.startsWith('custom/') ? '' : `<a class="btn" href="https://www.openstreetmap.org/${c.id}" target="_blank" rel="noopener">OSM</a>`}`;

  const st = statutDe(id);
  document.getElementById('ficheStatuts').innerHTML = Object.entries(STATUTS).map(([k, s]) =>
    `<button class="statut ${k === st ? 'on' : ''}" style="--c:${s.couleur}" data-s="${k}"><span class="dot" style="background:${s.couleur}"></span>${s.label}</button>`
  ).join('');

  document.getElementById('ficheCouleurs').innerHTML =
    `<button class="sw auto ${!e.couleur ? 'on' : ''}" data-col="" title="Couleur du statut">auto</button>` +
    COULEURS_LIBRES.map(col => `<button class="sw ${e.couleur === col ? 'on' : ''}" data-col="${col}" style="background:${col}" title="${col}"></button>`).join('') +
    `<input type="color" id="colLibre" value="${e.couleur || STATUTS[st].couleur}" title="Autre couleur" style="width:34px;height:34px;border:0;background:none;padding:0">`;

  document.getElementById('ficheMemo').value = e.memo || '';
  document.getElementById('ficheContact').value = e.contact || '';
  document.getElementById('ficheRappel').value = e.rappel || '';
  document.getElementById('saveState').textContent = e.maj ? `Dernière modif. ${new Date(e.maj).toLocaleString('fr-FR')}` : '';
  rendreHisto();
  document.getElementById('btnSupprimer').style.display = c.manuel ? '' : 'none';
  document.getElementById('fiche').classList.add('open');
  if (window.innerWidth <= 720) document.getElementById('liste').classList.remove('open');
}

function rendreHisto() {
  const h = etat(selection).histo || [];
  document.getElementById('ficheHisto').innerHTML = h.length
    ? h.map(x => `<div><time>${new Date(x.d).toLocaleDateString('fr-FR')} ${new Date(x.d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</time><span>${esc(x.t)}</span></div>`).join('')
    : '<div>Aucune action pour l’instant.</div>';
}

function fermerFiche() {
  document.getElementById('fiche').classList.remove('open');
  const ancienne = selection; selection = null;
  if (ancienne) rafraichirMarqueur(ancienne);
}
document.getElementById('fermerFiche').onclick = fermerFiche;

document.getElementById('ficheStatuts').addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b || !selection) return;
  const k = b.dataset.s;
  if (k === statutDe(selection)) return;
  majSuivi(selection, { statut: k }, `Statut → ${STATUTS[k].label}`);
  ouvrirFiche(selection);
});
document.getElementById('ficheCouleurs').addEventListener('click', e => {
  const b = e.target.closest('[data-col]'); if (!b || !selection) return;
  majSuivi(selection, { couleur: b.dataset.col || undefined });
  ouvrirFiche(selection);
});
document.getElementById('ficheCouleurs').addEventListener('change', e => {
  if (e.target.id !== 'colLibre' || !selection) return;
  majSuivi(selection, { couleur: e.target.value });
  ouvrirFiche(selection);
});

let tMemo;
function sauverChamp(champ, val) {
  document.getElementById('saveState').textContent = 'Enregistrement…';
  clearTimeout(tMemo);
  const id = selection;
  tMemo = setTimeout(() => {
    majSuivi(id, { [champ]: val });
    if (selection === id) document.getElementById('saveState').textContent = '✓ Enregistré';
  }, 400);
}
document.getElementById('ficheMemo').addEventListener('input', e => sauverChamp('memo', e.target.value));
document.getElementById('ficheContact').addEventListener('input', e => sauverChamp('contact', e.target.value));
document.getElementById('ficheRappel').addEventListener('change', e => {
  majSuivi(selection, { rappel: e.target.value || undefined }, e.target.value ? `Rappel prévu le ${new Date(e.target.value).toLocaleDateString('fr-FR')}` : 'Rappel retiré');
  rendreHisto();
});

// ---------- Liste ----------
function rendreListe() {
  const centre = map.getCenter();
  const vis = commerces.filter(visible)
    .map(c => ({ c, d: centre.distanceTo([c.lat, c.lon]) }))
    .sort((a, b) => (rappelEchu(b.c.id) - rappelEchu(a.c.id)) || a.d - b.d);
  document.getElementById('listeTitre').textContent = `${vis.length} commerces · triés par distance au centre de la carte`;
  document.getElementById('listeBody').innerHTML = vis.slice(0, 400).map(({ c, d }) => {
    const e = etat(c.id);
    return `<button class="item" data-id="${esc(c.id)}">
      <span class="dot" style="background:${couleurDe(c.id)}"></span>
      <span style="min-width:0">
        <div class="item-nom">${CATEGORIES[c.cat].emoji} ${esc(c.nom)}</div>
        <div class="item-sous">${esc(c.ville || c.adresse || '')}${c.ville || c.adresse ? ' · ' : ''}${d < 1000 ? Math.round(d) + ' m' : (d / 1000).toFixed(1) + ' km'} · ${STATUTS[statutDe(c.id)].label}${rappelEchu(c.id) ? ' · ⏰ rappel' : ''}</div>
        ${e.memo ? `<div class="item-memo">${esc(e.memo)}</div>` : ''}
      </span></button>`;
  }).join('') + (vis.length > 400 ? `<div class="liste-head">… ${vis.length - 400} autres, zoome ou filtre pour affiner.</div>` : '');
}
document.getElementById('listeBody').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const c = commerces.find(x => x.id === b.dataset.id);
  map.flyTo([c.lat, c.lon], Math.max(map.getZoom(), 17), { duration: 0.6 });
  ouvrirFiche(c.id);
});
document.getElementById('btnListe').onclick = e => {
  const l = document.getElementById('liste');
  l.classList.toggle('open'); e.currentTarget.classList.toggle('on', l.classList.contains('open'));
  if (l.classList.contains('open')) { rendreListe(); if (window.innerWidth <= 720) fermerFiche(); }
};
document.getElementById('fermerListe').onclick = () => { document.getElementById('liste').classList.remove('open'); document.getElementById('btnListe').classList.remove('on'); };
map.on('moveend', () => { if (document.getElementById('liste').classList.contains('open')) rendreListe(); });

// ---------- Géolocalisation ----------
let moi;
document.getElementById('btnLoc').onclick = () => {
  if (!navigator.geolocation) return toast('Géolocalisation non disponible.');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!moi) moi = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1, interactive: false }).addTo(map);
    else moi.setLatLng(ll);
    map.flyTo(ll, 16);
  }, () => toast('Position refusée ou indisponible.'), { enableHighAccuracy: true, timeout: 10000 });
};

// ---------- Ajout manuel ----------
document.getElementById('btnAjout').onclick = () => {
  modeAjout = !modeAjout;
  document.body.classList.toggle('mode-ajout', modeAjout);
  document.getElementById('btnAjout').classList.toggle('on', modeAjout);
  if (modeAjout) toast('Touche la carte à l’emplacement du commerce à ajouter.');
};
map.on('click', e => {
  if (!modeAjout) return;
  modeAjout = false; document.body.classList.remove('mode-ajout'); document.getElementById('btnAjout').classList.remove('on');
  const nom = prompt('Nom du commerce ?'); if (!nom) return;
  const choix = Object.entries(CATEGORIES).map(([k, c], i) => `${i + 1}. ${c.label}`).join('\n');
  const n = parseInt(prompt('Catégorie (numéro) :\n' + choix, '1'), 10);
  const cat = Object.keys(CATEGORIES)[(n || 1) - 1] || 'autre';
  const ville = prompt('Ville ?', '') || '';
  const c = { id: 'custom/' + Date.now().toString(36), nom, cat, lat: e.latlng.lat, lon: e.latlng.lng, ville, adresse: ville, tel: '', web: '', email: '', horaires: '', chaine: false, marque: '', manuel: true };
  ajouts.push(c); ecrire(K_AJOUTS, ajouts);
  commerces.push(c); creerMarqueur(c);
  majSuivi(c.id, {}, 'Commerce ajouté à la main');
  ouvrirFiche(c.id);
});
document.getElementById('btnSupprimer').onclick = () => {
  if (!selection || !confirm('Supprimer ce commerce ajouté et son suivi ?')) return;
  const id = selection; fermerFiche();
  ajouts = ajouts.filter(a => a.id !== id); ecrire(K_AJOUTS, ajouts);
  commerces = commerces.filter(c => c.id !== id);
  marqueurs.get(id)?.remove(); marqueurs.delete(id);
  delete suivi[id]; ecrire(K_SUIVI, suivi); majCompteurs();
};

// ---------- Export / import ----------
function telecharger(nom, contenu, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenu], { type }));
  a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
document.getElementById('btnExportCsv').onclick = () => {
  const cols = ['Nom', 'Catégorie', 'Chaîne', 'Adresse', 'Ville', 'Téléphone', 'Email', 'Site', 'Statut', 'Couleur', 'Contact', 'Rappel', 'Mémo', 'Dernière modif', 'Latitude', 'Longitude', 'Id'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lignes = commerces.filter(visible).map(c => {
    const e = etat(c.id);
    return [c.nom, CATEGORIES[c.cat].label, c.chaine ? c.marque || 'oui' : '', c.adresse, c.ville, c.tel, c.email, c.web,
      STATUTS[statutDe(c.id)].label, couleurDe(c.id), e.contact, e.rappel, e.memo, e.maj ? new Date(e.maj).toLocaleString('fr-FR') : '', c.lat, c.lon, c.id].map(q).join(';');
  });
  telecharger(`prospection-${aujourdhui()}.csv`, '﻿' + [cols.map(q).join(';'), ...lignes].join('\n'), 'text/csv;charset=utf-8');
};
document.getElementById('btnExportJson').onclick = () => {
  telecharger(`prospection-sauvegarde-${aujourdhui()}.json`, JSON.stringify({ version: 1, date: new Date().toISOString(), suivi, ajouts }, null, 1), 'application/json');
};
document.getElementById('btnImport').onclick = () => document.getElementById('fichierImport').click();
document.getElementById('fichierImport').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.suivi) throw new Error('format');
    if (!confirm(`Fusionner la sauvegarde du ${new Date(d.date).toLocaleString('fr-FR')} ? (la version la plus récente de chaque fiche est conservée)`)) return;
    for (const [id, v] of Object.entries(d.suivi)) {
      if (!suivi[id] || (v.maj || '') > (suivi[id].maj || '')) suivi[id] = v;
    }
    const ids = new Set(ajouts.map(a => a.id));
    (d.ajouts || []).forEach(a => { if (!ids.has(a.id)) ajouts.push(a); });
    ecrire(K_SUIVI, suivi); ecrire(K_AJOUTS, ajouts);
    location.reload();
  } catch { toast('Fichier de sauvegarde invalide.'); }
  e.target.value = '';
};
document.getElementById('btnMaj').onclick = () => demarrer(true);

// ---------- UI divers ----------
let tToast;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('show'), 4000);
}
function afficherChargement(txt) {
  document.getElementById('chargementTxt').textContent = txt;
  document.getElementById('chargement').style.display = 'flex';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerFiche(); });

// ---------- Démarrage ----------
async function demarrer(force) {
  try {
    const data = await chargerOSM(force);
    marqueurs.forEach(m => m.remove()); marqueurs.clear();
    commerces = [...data.liste, ...ajouts];
    commerces.forEach(creerMarqueur);
    rendreChips(); appliquerFiltres(); ajusterHautCarte();
    if (force) toast(`${data.liste.length} commerces chargés depuis OpenStreetMap.`);
  } catch (e) {
    toast('Impossible de charger les commerces (connexion ?). Réessaie avec « Actualiser ».');
    commerces = [...ajouts]; commerces.forEach(creerMarqueur); rendreChips(); appliquerFiltres(); ajusterHautCarte();
  } finally {
    document.getElementById('chargement').style.display = 'none';
  }
}
ajusterHautCarte();
demarrer(false);
</script>
</body>
