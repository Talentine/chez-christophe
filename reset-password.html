<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F2C52">
<title>Réinitialiser mon mot de passe — Marchéo</title>
<style>
  :root { --bleu:#0F2C52; --creme:#F7F2E8; --texte-doux:#5c665f; --vert:#2f7a51; --rouge:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,serif; background:var(--creme); color:var(--bleu);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:440px; width:100%; background:#fff; border:2px solid var(--bleu);
          border-radius:20px; padding:28px 26px; box-shadow:0 4px 20px rgba(15,44,82,0.08); }
  h1 { font-size:24px; margin:0 0 6px; }
  .lead { color:var(--texte-doux); font-size:14.5px; margin:0 0 22px; line-height:1.5; }
  label { display:block; font-size:13px; color:var(--texte-doux); margin-bottom:4px; font-family:system-ui,sans-serif; }
  input { width:100%; padding:12px 14px; font-size:16px; border:1.5px solid #d5cdb8;
          border-radius:12px; margin-bottom:14px; font-family:system-ui,sans-serif;
          background:#fdfaf3; color:var(--bleu); }
  input:focus { outline:none; border-color:var(--bleu); background:#fff; }
  button { width:100%; padding:14px; font-size:16px; font-weight:700; border:none;
           border-radius:14px; background:var(--bleu); color:#fff; cursor:pointer;
           font-family:system-ui,sans-serif; }
  button:hover { opacity:.92; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .fb { min-height:22px; font-size:14px; margin-top:12px; font-family:system-ui,sans-serif; }
  .ok { color:var(--vert); }
  .err { color:var(--rouge); }
  .muted { color:var(--texte-doux); }
  .footer { margin-top:20px; text-align:center; font-size:13px; color:var(--texte-doux); font-family:system-ui,sans-serif; }
  .footer a { color:var(--bleu); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">

  <!-- Vue A : formulaire nouveau mot de passe (arrivée depuis lien mail) -->
  <div id="viewReset" hidden>
    <h1>Nouveau mot de passe</h1>
    <p class="lead">Choisissez un mot de passe pour votre compte Marchéo. 6 caractères minimum.</p>
    <form id="formReset" autocomplete="off">
      <label for="p1">Nouveau mot de passe</label>
      <input id="p1" type="password" minlength="6" required autocomplete="new-password">
      <label for="p2">Confirmez</label>
      <input id="p2" type="password" minlength="6" required autocomplete="new-password">
      <button type="submit" id="btnReset">Enregistrer</button>
      <div id="fbReset" class="fb"></div>
    </form>
  </div>

  <!-- Vue B : demander un mail de récupération -->
  <div id="viewAsk" hidden>
    <h1>Mot de passe oublié</h1>
    <p class="lead">Entrez votre email, on vous envoie un lien pour définir un nouveau mot de passe.</p>
    <form id="formAsk" autocomplete="on">
      <label for="email">Email du compte</label>
      <input id="email" type="email" required autocomplete="email" placeholder="vous@exemple.fr">
      <button type="submit" id="btnAsk">Envoyer le lien</button>
      <div id="fbAsk" class="fb"></div>
    </form>
    <div class="footer">
      <a href="/app-commercant.html">← Retour à la connexion</a>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://epvdzhzwfmtnioedyfgm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwdmR6aHp3Zm10bmlvZWR5ZmdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDYwMTgsImV4cCI6MjA5MjAyMjAxOH0.NnMHas3OCJxfqQW3lUG9LDrklsuO_c9-Xpm41K5q1uc';

/* Parse hash (#type=recovery&access_token=…) — ou parfois query (?type=recovery&access_token=…) */
function parseTokens() {
  const src = (location.hash && location.hash.length > 1)
    ? location.hash.slice(1)
    : (location.search && location.search.length > 1 ? location.search.slice(1) : '');
  if (!src) return null;
  const p = new URLSearchParams(src);
  const type = p.get('type');
  const at = p.get('access_token');
  const err = p.get('error') || p.get('error_description');
  return { type, access_token: at, error: err };
}

const parsed = parseTokens();
const viewReset = document.getElementById('viewReset');
const viewAsk = document.getElementById('viewAsk');
const fbReset = document.getElementById('fbReset');
const fbAsk = document.getElementById('fbAsk');

if (parsed && parsed.error) {
  viewAsk.hidden = false;
  fbAsk.textContent = '⚠️ Lien expiré ou invalide — redemandez un nouveau mail.';
  fbAsk.className = 'fb err';
} else if (parsed && parsed.access_token && parsed.type === 'recovery') {
  viewReset.hidden = false;
} else {
  viewAsk.hidden = false;
}

/* ── A : réinitialiser avec le token du lien ─────────────────────── */
document.getElementById('formReset').addEventListener('submit', async (e) => {
  e.preventDefault();
  fbReset.textContent = ''; fbReset.className = 'fb';
  const p1 = document.getElementById('p1').value;
  const p2 = document.getElementById('p2').value;
  if (p1.length < 6) { fbReset.textContent = '✗ 6 caractères minimum.'; fbReset.className = 'fb err'; return; }
  if (p1 !== p2)     { fbReset.textContent = '✗ Les deux mots de passe ne correspondent pas.'; fbReset.className = 'fb err'; return; }

  const btn = document.getElementById('btnReset');
  btn.disabled = true;
  fbReset.textContent = '⏳ Mise à jour…'; fbReset.className = 'fb muted';

  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + parsed.access_token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ password: p1 })
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      fbReset.textContent = '✗ ' + (err.msg || err.message || err.error_description || ('Erreur ' + r.status));
      fbReset.className = 'fb err';
      btn.disabled = false;
      return;
    }
    fbReset.textContent = '✓ Mot de passe mis à jour. Redirection…';
    fbReset.className = 'fb ok';
    // Nettoie le hash pour éviter que le token traîne dans l'historique.
    try { history.replaceState(null, '', location.pathname); } catch(_) {}
    setTimeout(() => { location.href = '/app-commercant.html'; }, 1200);
  } catch (err) {
    fbReset.textContent = '✗ Erreur réseau — réessayez.';
    fbReset.className = 'fb err';
    btn.disabled = false;
  }
});

/* ── B : demander un nouveau mail de récupération ─────────────────── */
document.getElementById('formAsk').addEventListener('submit', async (e) => {
  e.preventDefault();
  fbAsk.textContent = ''; fbAsk.className = 'fb';
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email) return;

  const btn = document.getElementById('btnAsk');
  btn.disabled = true;
  fbAsk.textContent = '⏳ Envoi…'; fbAsk.className = 'fb muted';

  const redirectTo = location.origin + '/reset-password.html';
  try {
    // On passe par notre Edge Function qui envoie via Resend + template Marchéo,
    // au lieu du SMTP Supabase natif (qui part en spam sans domaine configuré).
    const r = await fetch(SUPABASE_URL + '/functions/v1/password-recovery', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, redirectTo })
    });
    // La fonction répond toujours 200 (neutre) même si l'email n'existe pas.
    if (r.ok) {
      fbAsk.textContent = '✓ Si un compte existe, un mail vient de partir. Pense à vérifier le dossier Spam.';
      fbAsk.className = 'fb ok';
    } else {
      const err = await r.json().catch(() => ({}));
      fbAsk.textContent = '✗ ' + (err.error || err.message || ('Erreur ' + r.status));
      fbAsk.className = 'fb err';
      btn.disabled = false;
    }
  } catch (err) {
    fbAsk.textContent = '✗ Erreur réseau — réessayez.';
    fbAsk.className = 'fb err';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
